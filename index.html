<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D M PRODUCTIONS — Warehouse & Workforce Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#14031D] text-white antialiased selection:bg-amber-500 selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const DEFAULT_PINS = { owner: '1111', planner: '2222', factory_staff: '3333', office_staff: '4444' };

    const INITIAL_INVENTORY = [
      { id: '1', name: 'Staging Angle Ply (8x4 ft)', category: 'Staging & Trusses', total: 100, out: 0, maintenance: 0, image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80', unit: 'Pcs' },
      { id: '2', name: 'Aluminum Box Truss (10ft)', category: 'Staging & Trusses', total: 40, out: 12, maintenance: 1, image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop&q=80', unit: 'Pcs' },
      { id: '3', name: 'Royal Velvet Drapes (Maroon)', category: 'Fabrics & Drapes', total: 60, out: 20, maintenance: 2, image: 'https://images.unsplash.com/photo-1519741497674-611481863552?w=300&auto=format&fit=crop&q=80', unit: 'Rolls' },
      { id: '4', name: 'Brass Mandap Pillars', category: 'Wedding Decor & Props', total: 16, out: 8, maintenance: 0, image: 'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=300&auto=format&fit=crop&q=80', unit: 'Sets' },
      { id: '5', name: 'Gold Mirror Island Bar', category: 'Bar Structures', total: 4, out: 2, maintenance: 0, image: 'https://images.unsplash.com/photo-1572116469696-31de0f17cc34?w=300&auto=format&fit=crop&q=80', unit: 'Units' },
      { id: '6', name: 'Crystal Chandelier (Large)', category: 'Detailing Props', total: 12, out: 4, maintenance: 1, image: 'https://images.unsplash.com/photo-1543198181-e619b692b11c?w=300&auto=format&fit=crop&q=80', unit: 'Pcs' },
    ];

    const INITIAL_EVENTS = [
      { id: 'evt-101', name: 'Sharma Destination Wedding', venue: 'Grand Hyatt, Goa', date: '2026-09-12', status: 'Active' },
      { id: 'evt-102', name: 'Sunburn Pre-Party Setup', venue: 'Vagator Beach Club', date: '2026-09-18', status: 'Upcoming' },
    ];

    const INITIAL_WORKERS = [
      { id: 'w1', name: 'Ramesh Kumar', type: 'Permanent', role: 'Stage Crew', status: 'Present', dailyWage: 800 },
      { id: 'w2', name: 'Suresh Naik', type: 'Contractor', role: 'Fabric Decorator', status: 'Present', dailyWage: 950 },
      { id: 'w3', name: 'Anil Gawde', type: 'Freelancer', role: 'Lighting Tech', status: 'Absent', dailyWage: 1200 },
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loginRole, setLoginRole] = useState('owner');
      const [pinInput, setPinInput] = useState('');

      const [rolePins, setRolePins] = useState(() => {
        const saved = localStorage.getItem('dm_pins_v2');
        return saved ? JSON.parse(saved) : DEFAULT_PINS;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('dm_inventory_v2');
        return saved ? JSON.parse(saved) : INITIAL_INVENTORY;
      });
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('dm_events_v2');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });
      const [workers, setWorkers] = useState(() => {
        const saved = localStorage.getItem('dm_workers_v2');
        return saved ? JSON.parse(saved) : INITIAL_WORKERS;
      });

      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedEventId, setSelectedEventId] = useState(INITIAL_EVENTS[0].id);
      
      // Editing item modal state
      const [editingItem, setEditingItem] = useState(null);
      const [newItem, setNewItem] = useState({ name: '', category: 'Staging & Trusses', total: 10, unit: 'Pcs', image: '' });

      // Worker form state
      const [newWorker, setNewWorker] = useState({ name: '', type: 'Permanent', role: 'Stage Crew', dailyWage: 800 });

      useEffect(() => { localStorage.setItem('dm_inventory_v2', JSON.stringify(inventory)); }, [inventory]);
      useEffect(() => { localStorage.setItem('dm_events_v2', JSON.stringify(events)); }, [events]);
      useEffect(() => { localStorage.setItem('dm_workers_v2', JSON.stringify(workers)); }, [workers]);
      useEffect(() => { localStorage.setItem('dm_pins_v2', JSON.stringify(rolePins)); }, [rolePins]);

      const categories = ['All', 'Staging & Trusses', 'Wedding Decor & Props', 'Fabrics & Drapes', 'Bar Structures', 'Detailing Props'];

      const handleLogin = (e) => {
        e.preventDefault();
        if (rolePins[loginRole] === pinInput) {
          setCurrentUser({ role: loginRole, title: getRoleTitle(loginRole) });
          setPinInput('');
          setActiveTab('dashboard');
        } else {
          alert('Incorrect PIN! Check default PIN hints at bottom.');
        }
      };

      function getRoleTitle(r) {
        if (r === 'owner') return '👑 Owner / Director';
        if (r === 'planner') return '📋 Event Planner';
        if (r === 'factory_staff') return '🏭 Factory Manager';
        if (r === 'office_staff') return '💼 Office Staff';
        return 'User';
      }

      // Counts & Stats
      const totalStock = useMemo(() => inventory.reduce((a, b) => a + Number(b.total), 0), [inventory]);
      const totalOut = useMemo(() => inventory.reduce((a, b) => a + Number(a.out || b.out), 0), [inventory]);
      const totalMaint = useMemo(() => inventory.reduce((a, b) => a + Number(a.maintenance || b.maintenance), 0), [inventory]);
      const totalAvailable = totalStock - totalOut - totalMaint;

      const filteredInventory = useMemo(() => {
        return inventory.filter(item => {
          const matchCat = selectedCategory === 'All' || item.category === selectedCategory;
          const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [inventory, selectedCategory, searchTerm]);

      // Actions
      const updateStock = (id, field, delta) => {
        setInventory(prev => prev.map(item => {
          if (item.id === id) {
            const newVal = Math.max(0, (item[field] || 0) + delta);
            return { ...item, [field]: newVal };
          }
          return item;
        }));
      };

      const handleSaveNewItem = (e) => {
        e.preventDefault();
        if (!newItem.name) return;
        const item = {
          ...newItem,
          id: 'item_' + Date.now(),
          total: Number(newItem.total),
          out: 0,
          maintenance: 0,
          image: newItem.image || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80'
        };
        setInventory([...inventory, item]);
        setNewItem({ name: '', category: 'Staging & Trusses', total: 10, unit: 'Pcs', image: '' });
      };

      const handleUpdateItem = (e) => {
        e.preventDefault();
        setInventory(inventory.map(i => i.id === editingItem.id ? editingItem : i));
        setEditingItem(null);
      };

      const handleDeleteItem = (id) => {
        if (confirm('Delete this item from catalog?')) {
          setInventory(inventory.filter(i => i.id !== id));
        }
      };

      const handleAddWorker = (e) => {
        e.preventDefault();
        if (!newWorker.name) return;
        setWorkers([...workers, { ...newWorker, id: 'w_' + Date.now(), status: 'Present', dailyWage: Number(newWorker.dailyWage) }]);
        setNewWorker({ name: '', type: 'Permanent', role: 'Stage Crew', dailyWage: 800 });
      };

      const toggleWorkerStatus = (id) => {
        setWorkers(workers.map(w => w.id === id ? { ...w, status: w.status === 'Present' ? 'Absent' : 'Present' } : w));
      };

      // LOGIN SCREEN
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[#14031D]">
            <div className="w-full max-w-md bg-[#20072C] border border-purple-800 rounded-3xl p-8 space-y-6 shadow-2xl">
              <div className="text-center">
                <div className="w-16 h-16 bg-amber-500 rounded-full flex items-center justify-center text-black font-black text-2xl mx-auto mb-3 shadow-lg shadow-amber-500/20">★</div>
                <h1 className="text-2xl font-black text-amber-400">D M PRODUCTIONS</h1>
                <p className="text-xs text-purple-300 font-semibold uppercase tracking-widest mt-1">Access Control Portal</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-purple-300 mb-1">Select Role</label>
                  <select value={loginRole} onChange={e => setLoginRole(e.target.value)} className="w-full bg-[#14031D] text-white border border-purple-700 rounded-xl px-4 py-3 text-sm font-semibold">
                    <option value="owner">👑 Owner / Director</option>
                    <option value="factory_staff">🏭 Factory Manager & Staff</option>
                    <option value="planner">📋 Event Planner</option>
                    <option value="office_staff">💼 Office Staff</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-purple-300 mb-1">Security PIN</label>
                  <input
                    type="password"
                    placeholder="Enter Security PIN"
                    value={pinInput}
                    onChange={e => setPinInput(e.target.value)}
                    className="w-full bg-[#14031D] text-amber-400 border border-purple-700 rounded-xl px-4 py-3 text-center text-xl font-bold tracking-widest"
                  />
                  <p className="text-[11px] text-purple-400 text-center mt-2">
                    Default PINs — Owner: <span className="text-amber-400 font-bold">{rolePins.owner}</span> | Factory: <span className="text-amber-400 font-bold">{rolePins.factory_staff}</span> | Planner: <span className="text-amber-400 font-bold">{rolePins.planner}</span> | Office: <span className="text-amber-400 font-bold">{rolePins.office_staff}</span>
                  </p>
                </div>

                <button type="submit" className="w-full py-4 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-2xl text-base transition">
                  Unlock Access Portal
                </button>
              </form>
            </div>
          </div>
        );
      }

      // MAIN APP
      return (
        <div className="min-h-screen pb-12">
          {/* Header */}
          <header className="bg-[#20072C] border-b border-[#3D1152] sticky top-0 z-50 px-6 py-3 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 bg-amber-500 rounded-full flex items-center justify-center text-black font-black text-sm">★</div>
              <div>
                <h1 className="font-extrabold text-base text-amber-400 leading-none">D M PRODUCTIONS</h1>
                <p className="text-[10px] text-purple-300 font-semibold">{currentUser.title}</p>
              </div>
            </div>
            <button onClick={() => setCurrentUser(null)} className="px-4 py-2 bg-rose-900/60 hover:bg-rose-800 text-rose-200 border border-rose-700/50 rounded-xl text-xs font-bold">
              🔒 Exit Portal
            </button>
          </header>

          {/* Navigation Bar */}
          <div className="bg-[#1A0524] border-b border-purple-900/40 px-6 py-2 sticky top-[57px] z-40 flex gap-2 overflow-x-auto">
            <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'dashboard' ? 'bg-amber-500 text-black' : 'bg-[#250833] text-purple-200 hover:bg-purple-900/50'}`}>📊 Dashboard</button>
            <button onClick={() => setActiveTab('catalog')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'catalog' ? 'bg-amber-500 text-black' : 'bg-[#250833] text-purple-200 hover:bg-purple-900/50'}`}>📦 Catalog & Stock Edit</button>
            <button onClick={() => setActiveTab('dispatch')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'dispatch' ? 'bg-amber-500 text-black' : 'bg-[#250833] text-purple-200 hover:bg-purple-900/50'}`}>🚚 Dispatch OUT</button>
            <button onClick={() => setActiveTab('return')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'return' ? 'bg-amber-500 text-black' : 'bg-[#250833] text-purple-200 hover:bg-purple-900/50'}`}>📥 Return IN</button>
            <button onClick={() => setActiveTab('labor')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'labor' ? 'bg-amber-500 text-black' : 'bg-[#250833] text-purple-200 hover:bg-purple-900/50'}`}>👷 Labor & Attendance</button>
            {currentUser.role === 'owner' && (
              <button onClick={() => setActiveTab('settings')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'settings' ? 'bg-amber-500 text-black' : 'bg-[#250833] text-purple-200 hover:bg-purple-900/50'}`}>⚙️ Security PINs</button>
            )}
          </div>

          <main className="max-w-7xl mx-auto px-6 mt-6 space-y-6">

            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-[#20072C] p-5 rounded-2xl border border-purple-800">
                    <p className="text-xs text-purple-300 font-bold uppercase">Total Registered Stock</p>
                    <p className="text-3xl font-black text-white mt-1">{totalStock}</p>
                  </div>
                  <div className="bg-[#20072C] p-5 rounded-2xl border border-emerald-500/40">
                    <p className="text-xs text-emerald-400 font-bold uppercase">Available in Workshop</p>
                    <p className="text-3xl font-black text-emerald-400 mt-1">{totalAvailable}</p>
                  </div>
                  <div className="bg-[#20072C] p-5 rounded-2xl border border-amber-500/40">
                    <p className="text-xs text-amber-400 font-bold uppercase">Deployed at Events</p>
                    <p className="text-3xl font-black text-amber-400 mt-1">{totalOut}</p>
                  </div>
                  <div className="bg-[#20072C] p-5 rounded-2xl border border-rose-500/40">
                    <p className="text-xs text-rose-400 font-bold uppercase">Damaged / Maintenance</p>
                    <p className="text-3xl font-black text-rose-400 mt-1">{totalMaint}</p>
                  </div>
                </div>

                <div className="bg-[#20072C] p-6 rounded-2xl border border-purple-800 space-y-4">
                  <h3 className="text-lg font-bold text-amber-400">Overview Inventory Breakdown</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {inventory.map(item => {
                      const avail = item.total - item.out - item.maintenance;
                      return (
                        <div key={item.id} className="bg-[#14031D] p-4 rounded-xl border border-purple-900/60 flex items-center justify-between">
                          <div>
                            <h4 className="font-bold text-white text-sm">{item.name}</h4>
                            <p className="text-xs text-purple-400">{item.category}</p>
                          </div>
                          <div className="text-right">
                            <span className="text-xs px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold">{avail} Avail</span>
                            <span className="text-xs px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold ml-2">{item.out} Out</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: CATALOG & EDIT */}
            {activeTab === 'catalog' && (
              <div className="space-y-6">
                {/* Search & Category Filter */}
                <div className="flex flex-col md:flex-row gap-3 justify-between items-center bg-[#20072C] p-4 rounded-2xl border border-purple-800">
                  <input
                    type="text"
                    placeholder="Search catalog items..."
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    className="w-full md:w-72 bg-[#14031D] border border-purple-700 px-4 py-2 rounded-xl text-sm"
                  />
                  <div className="flex gap-2 overflow-x-auto w-full md:w-auto">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${selectedCategory === cat ? 'bg-amber-500 text-black' : 'bg-[#14031D] text-purple-300 border border-purple-800'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Add New Item Form */}
                <div className="bg-[#20072C] p-6 rounded-2xl border border-purple-800 space-y-4">
                  <h3 className="text-lg font-bold text-amber-400">➕ Add New Item to Catalog</h3>
                  <form onSubmit={handleSaveNewItem} className="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <input type="text" placeholder="Item Name" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm" />
                    <select value={newItem.category} onChange={e => setNewItem({...newItem, category: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm">
                      {categories.filter(c => c !== 'All').map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <input type="number" placeholder="Total Workshop Stock" value={newItem.total} onChange={e => setNewItem({...newItem, total: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm" />
                    <input type="text" placeholder="Image URL (Optional)" value={newItem.image} onChange={e => setNewItem({...newItem, image: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm" />
                    <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold p-3 rounded-xl text-sm">+ Save Item</button>
                  </form>
                </div>

                {/* Edit Item Modal */}
                {editingItem && (
                  <div className="bg-[#2A093B] p-6 rounded-2xl border-2 border-amber-500 space-y-4">
                    <h3 className="text-lg font-bold text-amber-400">✏️ Edit Details: {editingItem.name}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                      <div>
                        <label className="text-xs text-purple-300 font-bold">Item Name</label>
                        <input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full bg-[#14031D] p-2.5 rounded-xl text-sm border border-purple-700 mt-1" />
                      </div>
                      <div>
                        <label className="text-xs text-purple-300 font-bold">Total Stock</label>
                        <input type="number" value={editingItem.total} onChange={e => setEditingItem({...editingItem, total: Number(e.target.value)})} className="w-full bg-[#14031D] p-2.5 rounded-xl text-sm border border-purple-700 mt-1" />
                      </div>
                      <div>
                        <label className="text-xs text-purple-300 font-bold">Damaged/Maintenance</label>
                        <input type="number" value={editingItem.maintenance} onChange={e => setEditingItem({...editingItem, maintenance: Number(e.target.value)})} className="w-full bg-[#14031D] p-2.5 rounded-xl text-sm border border-purple-700 mt-1" />
                      </div>
                      <div className="flex gap-2 items-end">
                        <button onClick={handleUpdateItem} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-xl text-sm">Save</button>
                        <button onClick={() => setEditingItem(null)} className="w-full bg-purple-900 hover:bg-purple-800 text-purple-200 font-bold p-2.5 rounded-xl text-sm">Cancel</button>
                      </div>
                    </div>
                  </div>
                )}

                {/* Catalog Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {filteredInventory.map(item => {
                    const avail = item.total - item.out - item.maintenance;
                    return (
                      <div key={item.id} className="bg-[#20072C] p-5 rounded-2xl border border-purple-800/80 flex flex-col justify-between">
                        <div>
                          <img src={item.image} className="w-full h-36 object-cover rounded-xl mb-3 border border-purple-900" />
                          <span className="text-[10px] uppercase tracking-wider font-extrabold text-amber-400">{item.category}</span>
                          <h4 className="font-bold text-white text-base mt-0.5">{item.name}</h4>
                          
                          <div className="grid grid-cols-3 gap-2 mt-3 text-center">
                            <div className="bg-[#14031D] p-2 rounded-xl border border-purple-900">
                              <p className="text-[10px] text-purple-400">Total</p>
                              <p className="font-bold text-sm text-white">{item.total}</p>
                            </div>
                            <div className="bg-[#14031D] p-2 rounded-xl border border-purple-900">
                              <p className="text-[10px] text-emerald-400">Avail</p>
                              <p className="font-bold text-sm text-emerald-400">{avail}</p>
                            </div>
                            <div className="bg-[#14031D] p-2 rounded-xl border border-purple-900">
                              <p className="text-[10px] text-amber-400">Out</p>
                              <p className="font-bold text-sm text-amber-400">{item.out}</p>
                            </div>
                          </div>
                        </div>

                        <div className="flex gap-2 mt-4">
                          <button onClick={() => setEditingItem(item)} className="flex-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 p-2.5 rounded-xl text-xs font-bold border border-amber-500/40">✏️ Edit Details</button>
                          <button onClick={() => handleDeleteItem(item.id)} className="bg-rose-900/40 hover:bg-rose-900/80 text-rose-300 p-2.5 rounded-xl text-xs font-bold border border-rose-800">🗑️ Delete</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB: DISPATCH OUT */}
            {activeTab === 'dispatch' && (
              <div className="bg-[#20072C] p-6 rounded-2xl border border-purple-800 space-y-6">
                <h3 className="text-xl font-bold text-amber-400">🚚 Dispatch Inventory (Workshop ➔ Site)</h3>
                
                <div className="space-y-4">
                  {inventory.map(item => {
                    const avail = item.total - item.out - item.maintenance;
                    return (
                      <div key={item.id} className="bg-[#14031D] p-4 rounded-xl border border-purple-900 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                          <h4 className="font-bold text-white text-base">{item.name}</h4>
                          <p className="text-xs text-purple-400">Available to dispatch: <span className="text-emerald-400 font-bold">{avail} {item.unit}</span> | Currently Out: <span className="text-amber-400 font-bold">{item.out}</span></p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateStock(item.id, 'out', 1)} disabled={avail <= 0} className="px-4 py-2 bg-amber-500 disabled:opacity-30 text-black font-extrabold rounded-xl text-sm">+ Dispatch 1</button>
                          <button onClick={() => updateStock(item.id, 'out', 5)} disabled={avail < 5} className="px-4 py-2 bg-amber-500 disabled:opacity-30 text-black font-extrabold rounded-xl text-sm">+ Dispatch 5</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB: RETURN IN */}
            {activeTab === 'return' && (
              <div className="bg-[#20072C] p-6 rounded-2xl border border-purple-800 space-y-6">
                <h3 className="text-xl font-bold text-amber-400">📥 Receive Inventory Return (Site ➔ Workshop)</h3>
                
                <div className="space-y-4">
                  {inventory.map(item => (
                    <div key={item.id} className="bg-[#14031D] p-4 rounded-xl border border-purple-900 flex flex-col md:flex-row justify-between items-center gap-4">
                      <div>
                        <h4 className="font-bold text-white text-base">{item.name}</h4>
                        <p className="text-xs text-purple-400">Currently Deployed at Sites: <span className="text-amber-400 font-bold">{item.out} {item.unit}</span></p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => updateStock(item.id, 'out', -1)} disabled={item.out <= 0} className="px-4 py-2 bg-emerald-500 disabled:opacity-30 text-black font-extrabold rounded-xl text-sm">Return 1</button>
                        <button onClick={() => updateStock(item.id, 'out', -5)} disabled={item.out < 5} className="px-4 py-2 bg-emerald-500 disabled:opacity-30 text-black font-extrabold rounded-xl text-sm">Return 5</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: LABOR & ATTENDANCE */}
            {activeTab === 'labor' && (
              <div className="space-y-6">
                <div className="bg-[#20072C] p-6 rounded-2xl border border-purple-800 space-y-4">
                  <h3 className="text-lg font-bold text-amber-400">👷 Add On-Site Crew / Staff</h3>
                  <form onSubmit={handleAddWorker} className="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <input type="text" placeholder="Worker Name" value={newWorker.name} onChange={e => setNewWorker({...newWorker, name: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm" />
                    <select value={newWorker.type} onChange={e => setNewWorker({...newWorker, type: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm">
                      <option value="Permanent">Permanent</option>
                      <option value="Contractor">Contractor</option>
                      <option value="Freelancer">Freelancer</option>
                    </select>
                    <input type="text" placeholder="Role (e.g. Stage Crew)" value={newWorker.role} onChange={e => setNewWorker({...newWorker, role: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm" />
                    <input type="number" placeholder="Daily Wage (₹)" value={newWorker.dailyWage} onChange={e => setNewWorker({...newWorker, dailyWage: e.target.value})} className="bg-[#14031D] p-3 rounded-xl border border-purple-700 text-sm" />
                    <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold p-3 rounded-xl text-sm">+ Add Worker</button>
                  </form>
                </div>

                <div className="bg-[#20072C] p-6 rounded-2xl border border-purple-800 space-y-4">
                  <h3 className="text-lg font-bold text-amber-400">Daily Attendance Tracker</h3>
                  <div className="space-y-3">
                    {workers.map(w => (
                      <div key={w.id} className="bg-[#14031D] p-4 rounded-xl border border-purple-900 flex justify-between items-center">
                        <div>
                          <h4 className="font-bold text-white text-sm">{w.name}</h4>
                          <p className="text-xs text-purple-400">{w.type} • {w.role} • Rate: ₹{w.dailyWage}/day</p>
                        </div>
                        <button
                          onClick={() => toggleWorkerStatus(w.id)}
                          className={`px-4 py-2 rounded-xl text-xs font-bold transition ${w.status === 'Present' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-900/30 text-rose-400 border border-rose-800'}`}
                        >
                          {w.status === 'Present' ? '✓ Present' : '✗ Absent'}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: SECURITY SETTINGS */}
            {activeTab === 'settings' && currentUser.role === 'owner' && (
              <div className="bg-[#20072C] p-6 rounded-2xl border border-purple-800 max-w-md space-y-4">
                <h3 className="text-lg font-bold text-amber-400">⚙️ Change Access Security PINs</h3>
                <p className="text-xs text-purple-300">Modifications save instantly to your browser memory.</p>
                
                {Object.keys(rolePins).map(role => (
                  <div key={role} className="flex items-center justify-between bg-[#14031D] p-3 rounded-xl border border-purple-900">
                    <span className="text-sm font-bold capitalize text-white">{role.replace('_', ' ')}</span>
                    <input
                      type="text"
                      value={rolePins[role]}
                      onChange={e => setRolePins({ ...rolePins, [role]: e.target.value })}
                      className="bg-[#20072C] text-amber-400 font-mono font-black px-3 py-1.5 rounded-lg border border-purple-700 w-24 text-center text-base"
                    />
                  </div>
                ))}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
