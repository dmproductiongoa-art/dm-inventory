<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D M PRODUCTIONS — Enterprise Operations Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0D0214] text-slate-100 antialiased selection:bg-amber-500 selection:text-black min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const DEFAULT_PINS = { owner: '1111', planner: '2222', factory_staff: '3333', office_staff: '4444' };

    const INITIAL_INVENTORY = [
      { id: 'INV-1001', name: 'Angle Ply (8x4 ft)', category: 'Staging & Trusses', total: 100, out: 15, unit: 'Pcs', rackLocation: 'Zone A - Rack 04' },
      { id: 'INV-1002', name: 'Angle Ply (6x4 ft)', category: 'Staging & Trusses', total: 80, out: 10, unit: 'Pcs', rackLocation: 'Zone A - Rack 05' },
      { id: 'INV-1003', name: 'Gold Mirror Island Bar', category: 'Bar Structures', total: 6, out: 2, unit: 'Units', rackLocation: 'Zone B - Bay 01' },
      { id: 'INV-1004', name: 'Vintage Wooden Bar', category: 'Bar Structures', total: 4, out: 1, unit: 'Units', rackLocation: 'Zone B - Bay 02' },
      { id: 'INV-1005', name: 'Aluminum Box Truss (10ft)', category: 'Staging & Trusses', total: 40, out: 12, unit: 'Pcs', rackLocation: 'Zone A - Rack 12' },
      { id: 'INV-1006', name: 'Royal Velvet Drapes (Maroon)', category: 'Fabrics & Drapes', total: 60, out: 20, unit: 'Rolls', rackLocation: 'Fabric Vault B' }
    ];

    const INITIAL_WORKERS = [
      { id: 'WRK-001', name: 'Ramesh Kumar', type: 'Inhouse', role: 'Lead Stage Crew', status: 'Present', sitePresence: 'In Warehouse', dailyWage: 950 },
      { id: 'WRK-002', name: 'Suresh Naik', type: 'Inhouse', role: 'Fabric Decorator', status: 'Present', sitePresence: 'In Warehouse', dailyWage: 1100 },
      { id: 'WRK-003', name: 'Amit Sharma', type: 'Market Labour', role: 'Rigging Engineer', status: 'Present', sitePresence: 'Singhania Wedding', dailyWage: 1500 },
      { id: 'WRK-004', name: 'Vikram Singh', type: 'Market Labour', role: 'General Helper', status: 'Present', sitePresence: 'Tech Summit 2026', dailyWage: 750 },
      { id: 'WRK-005', name: 'Pooja Verma', type: 'Inhouse', role: 'Site Supervisor', status: 'Absent', sitePresence: 'Off Duty', dailyWage: 1300 }
    ];

    const INITIAL_PROJECTS = [
      { id: 'PRJ-501', clientName: 'Singhania Wedding', location: 'Grand Hyatt Lawn', eventDate: '2026-09-05', status: 'Ongoing' },
      { id: 'PRJ-502', clientName: 'Tech Summit 2026', location: 'Exhibition Center - Hall 3', eventDate: '2026-09-12', status: 'Upcoming' },
      { id: 'PRJ-503', clientName: 'Royal Gala Dinner', location: 'Taj Palace', eventDate: '2026-09-18', status: 'Upcoming' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loginRole, setLoginRole] = useState('owner');
      const [pinInput, setPinInput] = useState('');

      const [rolePins, setRolePins] = useState(() => JSON.parse(localStorage.getItem('dm_pins_v8')) || DEFAULT_PINS);
      const [appLogo, setAppLogo] = useState(() => localStorage.getItem('dm_app_logo_v8') || null);

      const [activeTab, setActiveTab] = useState('dispatch');
      const [inventory, setInventory] = useState(() => JSON.parse(localStorage.getItem('dm_inventory_v8')) || INITIAL_INVENTORY);
      const [workers, setWorkers] = useState(() => JSON.parse(localStorage.getItem('dm_workers_v8')) || INITIAL_WORKERS);
      const [projects, setProjects] = useState(() => JSON.parse(localStorage.getItem('dm_projects_v8')) || INITIAL_PROJECTS);
      const [dispatchLogs, setDispatchLogs] = useState(() => JSON.parse(localStorage.getItem('dm_logs_v8')) || []);

      const [selectedCatTab, setSelectedCatTab] = useState('Staging & Trusses');
      const [selectedItemId, setSelectedItemId] = useState('');
      const [dispatchQuantity, setDispatchQuantity] = useState(1);
      const [targetProject, setTargetProject] = useState(projects[0]?.clientName || 'General Site');
      const [actionType, setActionType] = useState('OUT');

      // Forms State
      const [newItem, setNewItem] = useState({ name: '', category: 'Staging & Trusses', total: 10, unit: 'Pcs', rackLocation: '' });
      const [newWorker, setNewWorker] = useState({ name: '', type: 'Inhouse', role: 'Stage Crew', sitePresence: 'In Warehouse', dailyWage: 800 });
      const [newProject, setNewProject] = useState({ clientName: '', location: '', eventDate: '', status: 'Upcoming' });

      // Persistence Sync
      useEffect(() => { localStorage.setItem('dm_inventory_v8', JSON.stringify(inventory)); }, [inventory]);
      useEffect(() => { localStorage.setItem('dm_workers_v8', JSON.stringify(workers)); }, [workers]);
      useEffect(() => { localStorage.setItem('dm_projects_v8', JSON.stringify(projects)); }, [projects]);
      useEffect(() => { localStorage.setItem('dm_logs_v8', JSON.stringify(dispatchLogs)); }, [dispatchLogs]);
      useEffect(() => { localStorage.setItem('dm_pins_v8', JSON.stringify(rolePins)); }, [rolePins]);

      const categories = ['Staging & Trusses', 'Bar Structures', 'Fabrics & Drapes'];

      // Role Permissions
      const isOwner = currentUser?.role === 'owner';
      const isPlanner = currentUser?.role === 'planner';
      const isFactory = currentUser?.role === 'factory_staff';
      const isOffice = currentUser?.role === 'office_staff';

      const canDispatch = isOwner || isPlanner || isFactory;
      const canManageCatalog = isOwner || isFactory;
      const canEditPersonnel = isOwner || isOffice; // Only Editable access to Office Staff & Owner
      const canManageSettings = isOwner;

      // Aggregates for Dashboard Header Cards
      const ongoingEventsCount = useMemo(() => projects.filter(p => p.status === 'Ongoing').length, [projects]);
      const upcomingEventsCount = useMemo(() => projects.filter(p => p.status === 'Upcoming').length, [projects]);
      const availableInhouseCount = useMemo(() => workers.filter(w => w.type === 'Inhouse' && w.status === 'Present').length, [workers]);
      const marketLaboursCount = useMemo(() => workers.filter(w => w.type === 'Market Labour').length, [workers]);

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64Logo = reader.result;
            setAppLogo(base64Logo);
            localStorage.setItem('dm_app_logo_v8', base64Logo);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleClearLogo = () => {
        setAppLogo(null);
        localStorage.removeItem('dm_app_logo_v8');
      };

      const itemsInSelectedCategory = useMemo(() => {
        return inventory.filter(item => item.category === selectedCatTab);
      }, [inventory, selectedCatTab]);

      const activeSelectedItem = useMemo(() => {
        return inventory.find(i => i.id === selectedItemId) || itemsInSelectedCategory[0] || null;
      }, [inventory, selectedItemId, itemsInSelectedCategory]);

      useEffect(() => {
        if (itemsInSelectedCategory.length > 0) {
          setSelectedItemId(itemsInSelectedCategory[0].id);
        }
      }, [selectedCatTab]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (rolePins[loginRole] === pinInput) {
          setCurrentUser({ role: loginRole, title: getRoleTitle(loginRole) });
          setPinInput('');
          setActiveTab('dispatch');
        } else {
          alert('Invalid Authentication PIN.');
        }
      };

      function getRoleTitle(r) {
        if (r === 'owner') return '👑 Owner';
        if (r === 'planner') return '📋 Event Planner';
        if (r === 'factory_staff') return '🏭 Factory Manager';
        return '💼 Office Staff';
      }

      const handleExecuteMovement = (e) => {
        e.preventDefault();
        if (!activeSelectedItem || dispatchQuantity <= 0) return;

        const delta = actionType === 'OUT' ? Number(dispatchQuantity) : -Number(dispatchQuantity);
        
        if (actionType === 'OUT' && (activeSelectedItem.total - activeSelectedItem.out) < dispatchQuantity) {
          alert('Cannot dispatch more than available warehouse stock!');
          return;
        }
        if (actionType === 'IN' && activeSelectedItem.out < dispatchQuantity) {
          alert('Cannot return more units than currently deployed OUT!');
          return;
        }

        setInventory(prev => prev.map(item => {
          if (item.id === activeSelectedItem.id) {
            return { ...item, out: Math.max(0, item.out + delta) };
          }
          return item;
        }));

        const logEntry = {
          id: 'LOG-' + Date.now(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          itemName: activeSelectedItem.name,
          qty: dispatchQuantity,
          type: actionType,
          project: targetProject,
          by: currentUser.title
        };
        setDispatchLogs(logs => [logEntry, ...logs]);
        setDispatchQuantity(1);
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!newItem.name) return;
        setInventory([...inventory, { ...newItem, id: 'INV-' + (1000 + inventory.length + 1), total: Number(newItem.total), out: 0 }]);
        setNewItem({ name: '', category: 'Staging & Trusses', total: 10, unit: 'Pcs', rackLocation: '' });
      };

      const handleAddWorker = (e) => {
        e.preventDefault();
        if (!newWorker.name) return;
        setWorkers([...workers, { ...newWorker, id: 'WRK-' + (100 + workers.length + 1), status: 'Present', dailyWage: Number(newWorker.dailyWage) }]);
        setNewWorker({ name: '', type: 'Inhouse', role: 'Stage Crew', sitePresence: 'In Warehouse', dailyWage: 800 });
      };

      const handleAddProject = (e) => {
        e.preventDefault();
        if (!newProject.clientName) return;
        setProjects([...projects, { ...newProject, id: 'PRJ-' + (500 + projects.length + 1) }]);
        setNewProject({ clientName: '', location: '', eventDate: '', status: 'Upcoming' });
      };

      // LOGIN SCREEN
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[#0D0214]">
            <div className="w-full max-w-sm bg-[#1B0626] border border-purple-800/80 rounded-3xl p-6 space-y-6 shadow-2xl">
              <div className="text-center">
                {appLogo ? (
                  <img src={appLogo} className="w-20 h-20 rounded-2xl mx-auto mb-3 object-contain bg-[#0D0214] p-1 border-2 border-amber-400 shadow-lg" />
                ) : (
                  <div className="w-16 h-16 bg-amber-500 rounded-2xl flex items-center justify-center text-black font-black text-2xl mx-auto mb-3 shadow-lg">★</div>
                )}
                <h1 className="text-xl font-black text-amber-400">D M PRODUCTIONS</h1>
                <p className="text-[11px] text-purple-300 font-bold uppercase tracking-widest mt-0.5">Operations Control Login</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-purple-300 mb-1 uppercase">Select Access Role</label>
                  <select value={loginRole} onChange={e => setLoginRole(e.target.value)} className="w-full bg-[#0D0214] text-white border border-purple-700/80 rounded-xl px-3 py-2.5 text-sm font-semibold focus:border-amber-400">
                    <option value="owner">👑 Owner</option>
                    <option value="planner">📋 Event Planner</option>
                    <option value="factory_staff">🏭 Factory Manager</option>
                    <option value="office_staff">💼 Office Staff</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-purple-300 mb-1 uppercase">Enter PIN Code</label>
                  <input type="password" placeholder="••••" value={pinInput} onChange={e => setPinInput(e.target.value)} className="w-full bg-[#0D0214] text-amber-400 border border-purple-700/80 rounded-xl px-3 py-2 text-center text-2xl font-black tracking-widest focus:border-amber-400" />
                </div>

                <button type="submit" className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl text-sm shadow-lg shadow-amber-500/20 transition">
                  AUTHORIZE LOG IN
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12">
          {/* HEADER */}
          <header className="bg-[#1B0626] border-b border-purple-900/80 px-6 py-3 flex justify-between items-center sticky top-0 z-50">
            <div className="flex items-center gap-3">
              {appLogo ? (
                <img src={appLogo} className="w-10 h-10 rounded-xl object-contain bg-[#0D0214] p-0.5 border border-amber-400" />
              ) : (
                <div className="w-9 h-9 bg-amber-500 rounded-xl flex items-center justify-center text-black font-black text-lg">★</div>
              )}
              <div>
                <h1 className="font-black text-amber-400 text-base leading-none">D M PRODUCTIONS</h1>
                <p className="text-[10px] text-purple-300 font-bold mt-0.5">{currentUser.title}</p>
              </div>
            </div>
            <button onClick={() => setCurrentUser(null)} className="px-3.5 py-1.5 bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/60 rounded-xl text-xs font-bold transition">
              Logout Session
            </button>
          </header>

          {/* MAIN NAVIGATION TABS */}
          <div className="bg-[#13031C] border-b border-purple-900/60 px-6 py-2.5 flex gap-2 overflow-x-auto">
            {canDispatch && (
              <button onClick={() => setActiveTab('dispatch')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'dispatch' ? 'bg-amber-500 text-black' : 'bg-[#20072E] text-purple-200'}`}>
                ⚡ Tab Dispatch Entry
              </button>
            )}
            <button onClick={() => setActiveTab('overview')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'overview' ? 'bg-amber-500 text-black' : 'bg-[#20072E] text-purple-200'}`}>
              📊 Live Inventory Overview
            </button>
            {canManageCatalog && (
              <button onClick={() => setActiveTab('catalog')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'catalog' ? 'bg-amber-500 text-black' : 'bg-[#20072E] text-purple-200'}`}>
                📦 Catalog & Add Item
              </button>
            )}
            <button onClick={() => setActiveTab('inhouse_staff')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'inhouse_staff' ? 'bg-amber-500 text-black' : 'bg-[#20072E] text-purple-200'}`}>
              👷 Inhouse Employees
            </button>
            <button onClick={() => setActiveTab('market_labours')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'market_labours' ? 'bg-amber-500 text-black' : 'bg-[#20072E] text-purple-200'}`}>
              🔨 Market Labours
            </button>
            <button onClick={() => setActiveTab('projects')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'projects' ? 'bg-amber-500 text-black' : 'bg-[#20072E] text-purple-200'}`}>
              🎪 Events & Sites
            </button>
            {canManageSettings && (
              <button onClick={() => setActiveTab('settings')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'settings' ? 'bg-amber-500 text-black' : 'bg-[#20072E] text-purple-200'}`}>
                ⚙️ Logo & Settings
              </button>
            )}
          </div>

          <main className="max-w-6xl mx-auto px-6 mt-5 space-y-5">

            {/* NEW TOP DASHBOARD OVERVIEW CARDS WITH REDIRECT LINKS */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              
              {/* Ongoing Events Card */}
              <div 
                onClick={() => setActiveTab('projects')}
                className="bg-[#1B0626] p-4 rounded-2xl border border-emerald-500/40 hover:border-emerald-400 cursor-pointer transition flex justify-between items-center group"
              >
                <div>
                  <p className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider group-hover:underline">Ongoing Events</p>
                  <p className="text-2xl font-black text-emerald-400 mt-0.5">{ongoingEventsCount}</p>
                </div>
                <div className="text-2xl">🔥</div>
              </div>

              {/* Upcoming Events Card */}
              <div 
                onClick={() => setActiveTab('projects')}
                className="bg-[#1B0626] p-4 rounded-2xl border border-amber-500/40 hover:border-amber-400 cursor-pointer transition flex justify-between items-center group"
              >
                <div>
                  <p className="text-[10px] text-amber-400 font-bold uppercase tracking-wider group-hover:underline">Upcoming Events</p>
                  <p className="text-2xl font-black text-amber-400 mt-0.5">{upcomingEventsCount}</p>
                </div>
                <div className="text-2xl">📅</div>
              </div>

              {/* Available Staff Inhouse Card */}
              <div 
                onClick={() => setActiveTab('inhouse_staff')}
                className="bg-[#1B0626] p-4 rounded-2xl border border-purple-800/80 hover:border-purple-600 cursor-pointer transition flex justify-between items-center group"
              >
                <div>
                  <p className="text-[10px] text-purple-300 font-bold uppercase tracking-wider group-hover:underline">Available Staff Inhouse</p>
                  <p className="text-2xl font-black text-white mt-0.5">{availableInhouseCount}</p>
                </div>
                <div className="text-2xl">👷</div>
              </div>

              {/* Market Labours Count Card */}
              <div 
                onClick={() => setActiveTab('market_labours')}
                className="bg-[#1B0626] p-4 rounded-2xl border border-rose-500/40 hover:border-rose-400 cursor-pointer transition flex justify-between items-center group"
              >
                <div>
                  <p className="text-[10px] text-rose-400 font-bold uppercase tracking-wider group-hover:underline">Market Labours Count</p>
                  <p className="text-2xl font-black text-rose-400 mt-0.5">{marketLaboursCount}</p>
                </div>
                <div className="text-2xl">🔨</div>
              </div>

            </div>

            {/* TAB: TAB DISPATCH ENTRY */}
            {activeTab === 'dispatch' && canDispatch && (
              <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800 space-y-5">
                <div className="flex justify-between items-center border-b border-purple-900/80 pb-3">
                  <h3 className="text-base font-bold text-amber-400">⚡ Dispatch & Return Selection Entry</h3>
                  <div className="flex gap-2">
                    <button onClick={() => setActionType('OUT')} className={`px-3 py-1 rounded-lg text-xs font-extrabold ${actionType === 'OUT' ? 'bg-amber-500 text-black' : 'bg-[#0D0214] text-purple-400'}`}>Dispatch (OUT)</button>
                    <button onClick={() => setActionType('IN')} className={`px-3 py-1 rounded-lg text-xs font-extrabold ${actionType === 'IN' ? 'bg-emerald-500 text-black' : 'bg-[#0D0214] text-purple-400'}`}>Return (IN)</button>
                  </div>
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-purple-300 uppercase mb-2">Step 1: Select Category Tab</label>
                  <div className="flex gap-2">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCatTab(cat)}
                        className={`flex-1 py-2.5 rounded-xl text-xs font-black transition border ${selectedCatTab === cat ? 'bg-amber-500 text-black border-amber-400 shadow-md shadow-amber-500/20' : 'bg-[#0D0214] text-purple-300 border-purple-800/80 hover:bg-purple-900/30'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                <form onSubmit={handleExecuteMovement} className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-1">
                  <div>
                    <label className="block text-[11px] font-bold text-purple-300 uppercase mb-1.5">Step 2: Select Specific Item</label>
                    <select
                      value={selectedItemId}
                      onChange={e => setSelectedItemId(e.target.value)}
                      className="w-full bg-[#0D0214] text-white font-bold border border-purple-700/80 rounded-xl px-3 py-2.5 text-sm"
                    >
                      {itemsInSelectedCategory.map(item => (
                        <option key={item.id} value={item.id}>
                          {item.name} (Warehouse: {item.total - item.out} | OUT: {item.out})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-purple-300 uppercase mb-1.5">Step 3: Enter Unit Count</label>
                    <input
                      type="number"
                      min="1"
                      value={dispatchQuantity}
                      onChange={e => setDispatchQuantity(e.target.value)}
                      className="w-full bg-[#0D0214] text-amber-400 font-mono font-bold border border-purple-700/80 rounded-xl px-3 py-2 text-base"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-purple-300 uppercase mb-1.5">Target Event Site</label>
                    <select
                      value={targetProject}
                      onChange={e => setTargetProject(e.target.value)}
                      className="w-full bg-[#0D0214] text-white border border-purple-700/80 rounded-xl px-3 py-2.5 text-sm"
                    >
                      {projects.map(p => <option key={p.id} value={p.clientName}>{p.clientName} - {p.location}</option>)}
                      <option value="General Warehouse Maintenance">General Warehouse Maintenance</option>
                    </select>
                  </div>

                  <div className="md:col-span-3 pt-2">
                    <button
                      type="submit"
                      className={`w-full py-3.5 font-black text-sm rounded-xl transition ${actionType === 'OUT' ? 'bg-amber-500 text-black hover:bg-amber-400' : 'bg-emerald-500 text-black hover:bg-emerald-400'}`}
                    >
                      {actionType === 'OUT' ? `🚀 CONFIRM DISPATCH (${dispatchQuantity} UNITS)` : `📥 CONFIRM RETURN (${dispatchQuantity} UNITS)`}
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* TAB: LIVE INVENTORY OVERVIEW */}
            {(activeTab === 'overview' || isOwner) && (
              <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                <h3 className="text-base font-bold text-amber-400">📋 Live Inventory Breakdown</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-purple-200">
                    <thead className="bg-[#0D0214] text-purple-300 uppercase font-mono border-b border-purple-800">
                      <tr>
                        <th className="p-3">Item Name</th>
                        <th className="p-3">Category</th>
                        <th className="p-3">Rack Location</th>
                        <th className="p-3 text-center">Total Inventory Units</th>
                        <th className="p-3 text-center">Ready in Warehouse</th>
                        <th className="p-3 text-center">Deployed OUT</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-purple-900/60 font-semibold">
                      {inventory.map(item => {
                        const warehouseUnits = item.total - item.out;
                        return (
                          <tr key={item.id} className="hover:bg-purple-950/30 transition">
                            <td className="p-3 font-extrabold text-white">{item.name}</td>
                            <td className="p-3 text-purple-400">{item.category}</td>
                            <td className="p-3 text-purple-300 font-mono">{item.rackLocation}</td>
                            <td className="p-3 text-center font-bold text-white">{item.total} {item.unit}</td>
                            <td className="p-3 text-center font-black text-emerald-400">{warehouseUnits} {item.unit}</td>
                            <td className="p-3 text-center font-black text-amber-400">{item.out} {item.unit}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: CATALOG MANAGEMENT */}
            {activeTab === 'catalog' && canManageCatalog && (
              <div className="space-y-5">
                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                  <h3 className="text-base font-bold text-amber-400">➕ Add New Inventory Item</h3>
                  <form onSubmit={handleAddItem} className="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" required placeholder="Item Name" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                    <select value={newItem.category} onChange={e => setNewItem({...newItem, category: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm">
                      {categories.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <input type="number" required placeholder="Total Units" value={newItem.total} onChange={e => setNewItem({...newItem, total: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                    <input type="text" placeholder="Rack Location" value={newItem.rackLocation} onChange={e => setNewItem({...newItem, rackLocation: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                    <button type="submit" className="md:col-span-4 bg-amber-500 font-black text-black py-3 rounded-xl text-sm">+ Save Inventory Item</button>
                  </form>
                </div>
              </div>
            )}

            {/* TAB: INHOUSE EMPLOYEES (LIST OF EMPLOYEES - EDITABLE ONLY BY OWNER & OFFICE STAFF) */}
            {activeTab === 'inhouse_staff' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-amber-400">👷 List of Inhouse Employees</h3>
                  {!canEditPersonnel && (
                    <span className="text-xs bg-purple-950/80 text-purple-300 border border-purple-800 px-3 py-1 rounded-lg">🔒 View-Only Mode</span>
                  )}
                </div>

                {canEditPersonnel && (
                  <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                    <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider">Add Inhouse Employee</h4>
                    <form onSubmit={handleAddWorker} className="grid grid-cols-1 md:grid-cols-4 gap-3">
                      <input type="text" required placeholder="Employee Name" value={newWorker.name} onChange={e => setNewWorker({...newWorker, name: e.target.value, type: 'Inhouse'})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                      <input type="text" placeholder="Designation / Role" value={newWorker.role} onChange={e => setNewWorker({...newWorker, role: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                      <input type="number" placeholder="Daily Wage (₹)" value={newWorker.dailyWage} onChange={e => setNewWorker({...newWorker, dailyWage: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                      <button type="submit" className="bg-amber-500 font-black text-black py-3 rounded-xl text-sm">+ Add Employee</button>
                    </form>
                  </div>
                )}

                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-3">
                  {workers.filter(w => w.type === 'Inhouse').map(w => (
                    <div key={w.id} className="bg-[#0D0214] p-3.5 rounded-xl border border-purple-900 flex justify-between items-center text-xs">
                      <div>
                        <strong className="text-white text-sm">{w.name}</strong>
                        <p className="text-purple-400 mt-0.5">{w.role} • ₹{w.dailyWage}/day</p>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-purple-300 font-mono">Status: {w.status}</span>
                        {canEditPersonnel ? (
                          <button
                            onClick={() => setWorkers(workers.map(item => item.id === w.id ? { ...item, status: item.status === 'Present' ? 'Absent' : 'Present' } : item))}
                            className={`px-3 py-1 rounded-lg font-bold ${w.status === 'Present' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-950/40 text-rose-400 border border-rose-800'}`}
                          >
                            Toggle Status
                          </button>
                        ) : (
                          <span className={`px-3 py-1 rounded-lg font-bold ${w.status === 'Present' ? 'text-emerald-400' : 'text-rose-400'}`}>{w.status}</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: MARKET LABOURS (LIST + SITE PRESENCES + WAGES - EDITABLE ONLY BY OWNER & OFFICE STAFF) */}
            {activeTab === 'market_labours' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-amber-400">🔨 Market Labours & Site Presence</h3>
                  {!canEditPersonnel && (
                    <span className="text-xs bg-purple-950/80 text-purple-300 border border-purple-800 px-3 py-1 rounded-lg">🔒 View-Only Mode</span>
                  )}
                </div>

                {canEditPersonnel && (
                  <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                    <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider">Register Market Labour</h4>
                    <form onSubmit={handleAddWorker} className="grid grid-cols-1 md:grid-cols-4 gap-3">
                      <input type="text" required placeholder="Labour Name" value={newWorker.name} onChange={e => setNewWorker({...newWorker, name: e.target.value, type: 'Market Labour'})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                      <input type="text" placeholder="Assigned Site Presence" value={newWorker.sitePresence} onChange={e => setNewWorker({...newWorker, sitePresence: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                      <input type="number" placeholder="Daily Wage (₹)" value={newWorker.dailyWage} onChange={e => setNewWorker({...newWorker, dailyWage: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                      <button type="submit" className="bg-amber-500 font-black text-black py-3 rounded-xl text-sm">+ Add Market Labour</button>
                    </form>
                  </div>
                )}

                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-3">
                  {workers.filter(w => w.type === 'Market Labour').map(w => (
                    <div key={w.id} className="bg-[#0D0214] p-3.5 rounded-xl border border-purple-900 flex justify-between items-center text-xs">
                      <div>
                        <strong className="text-white text-sm">{w.name}</strong>
                        <p className="text-purple-400 mt-0.5">Role: {w.role} • 📍 Site: <span className="text-amber-300">{w.sitePresence}</span></p>
                      </div>
                      <div className="text-right">
                        <p className="text-emerald-400 font-black text-sm">Wage: ₹{w.dailyWage}/day</p>
                        {canEditPersonnel && (
                          <button
                            onClick={() => {
                              const newWage = prompt('Enter updated wage for ' + w.name, w.dailyWage);
                              if (newWage) setWorkers(workers.map(item => item.id === w.id ? { ...item, dailyWage: Number(newWage) } : item));
                            }}
                            className="text-[10px] text-purple-400 hover:text-amber-400 underline mt-1"
                          >
                            Edit Wage
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: EVENTS & SITES (EDITABLE & OVERVIEW LIST) */}
            {activeTab === 'projects' && (
              <div className="space-y-5">
                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                  <h3 className="text-base font-bold text-amber-400">🎪 Registered Events Overview & Management</h3>
                  <form onSubmit={handleAddProject} className="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" required placeholder="Client / Event Name" value={newProject.clientName} onChange={e => setNewProject({...newProject, clientName: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                    <input type="text" placeholder="Venue Location" value={newProject.location} onChange={e => setNewProject({...newProject, location: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm" />
                    <input type="date" value={newProject.eventDate} onChange={e => setNewProject({...newProject, eventDate: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm text-white" />
                    <select value={newProject.status} onChange={e => setNewProject({...newProject, status: e.target.value})} className="bg-[#0D0214] p-3 rounded-xl border border-purple-700/80 text-sm text-white">
                      <option value="Upcoming">Upcoming</option>
                      <option value="Ongoing">Ongoing</option>
                      <option value="Completed">Completed</option>
                    </select>
                    <button type="submit" className="md:col-span-4 bg-amber-500 font-black text-black py-3 rounded-xl text-sm">+ Register Event Site</button>
                  </form>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {projects.map(p => (
                    <div key={p.id} className="bg-[#1B0626] p-4 rounded-xl border border-purple-800/80 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] font-mono text-amber-400 font-bold">{p.id}</span>
                        <select
                          value={p.status}
                          onChange={e => setProjects(projects.map(item => item.id === p.id ? { ...item, status: e.target.value } : item))}
                          className={`text-xs font-bold px-2 py-1 rounded-lg border bg-[#0D0214] ${p.status === 'Ongoing' ? 'text-emerald-400 border-emerald-500/40' : 'text-amber-400 border-amber-500/40'}`}
                        >
                          <option value="Ongoing">Ongoing</option>
                          <option value="Upcoming">Upcoming</option>
                          <option value="Completed">Completed</option>
                        </select>
                      </div>
                      <h4 className="font-extrabold text-white text-base">{p.clientName}</h4>
                      <p className="text-xs text-purple-300">📍 {p.location}</p>
                      <p className="text-[11px] text-purple-400">📅 Date: {p.eventDate}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: SETTINGS */}
            {activeTab === 'settings' && canManageSettings && (
              <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 max-w-xl space-y-6">
                <div>
                  <h3 className="text-base font-bold text-amber-400">📷 Company Logo Branding</h3>
                  <div className="mt-4 flex items-center gap-4">
                    {appLogo ? (
                      <img src={appLogo} className="w-16 h-16 rounded-xl object-contain bg-[#0D0214] p-1 border-2 border-amber-400" />
                    ) : (
                      <div className="w-16 h-16 bg-amber-500 rounded-xl flex items-center justify-center text-black font-black text-2xl">★</div>
                    )}
                    <div className="space-y-2">
                      <input type="file" accept="image/*" onChange={handleLogoUpload} className="bg-[#0D0214] p-2 rounded-xl border border-purple-700 text-xs text-purple-200" />
                      {appLogo && (
                        <button onClick={handleClearLogo} className="block text-xs font-bold text-rose-400 hover:underline">Reset Logo</button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* AUDIT LOG */}
            <div className="bg-[#1B0626] p-5 rounded-2xl border border-purple-800/80 space-y-3">
              <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider">📜 Real-Time Session Audit Log</h4>
              <div className="space-y-2 max-h-36 overflow-y-auto">
                {dispatchLogs.length === 0 ? (
                  <p className="text-xs text-purple-400">No dispatch actions recorded in this session.</p>
                ) : (
                  dispatchLogs.map(log => (
                    <div key={log.id} className="bg-[#0D0214] p-2 rounded-lg border border-purple-900 flex justify-between items-center text-xs">
                      <div>
                        <span className={`font-mono font-bold px-1.5 py-0.5 rounded text-[10px] mr-2 ${log.type === 'OUT' ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                          {log.type} ({log.qty})
                        </span>
                        <span className="text-white font-bold">{log.itemName}</span>
                        <span className="text-purple-400 mx-2">➔</span>
                        <span className="text-amber-300">{log.project}</span>
                      </div>
                      <span className="text-purple-400 text-[10px]">{log.timestamp} ({log.by})</span>
                    </div>
                  ))
                )}
              </div>
            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
