  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const DEFAULT_PINS = { owner: '1111', planner: '2222', factory_staff: '3333', office_staff: '4444' };
    const DEFAULT_ROLE_TITLES = { owner: '👑 Owner', planner: '📋 Event Planner', factory_staff: '🏭 Factory Manager', office_staff: '💼 Office Staff' };

    const DEFAULT_TAB_NAMES = {

    };

    const INITIAL_INVENTORY = [
      { id: 'INV-1001', name: 'Angle Ply (8x4 ft)', category: 'Staging & Trusses', total: 100, out: 15, unit: 'Pcs', rackLocation: 'Zone A - Rack 04', condition: 'New', images: [{ url: '', uploadedAt: '2026-09-01 10:00' }] },
      { id: 'INV-1002', name: 'Angle Ply (6x4 ft)', category: 'Staging & Trusses', total: 80, out: 10, unit: 'Pcs', rackLocation: 'Zone A - Rack 05', condition: 'Refurbished', images: [] },
      { id: 'INV-1003', name: 'Gold Mirror Island Bar', category: 'Bar Structures', total: 6, out: 2, unit: 'Units', rackLocation: 'Zone B - Bay 01', condition: 'New', images: [] },
      { id: 'INV-1004', name: 'Vintage Wooden Bar', category: 'Bar Structures', total: 4, out: 1, unit: 'Units', rackLocation: 'Zone B - Bay 02', condition: 'Old', images: [] },
      { id: 'INV-1005', name: 'Aluminum Box Truss (10ft)', category: 'Staging & Trusses', total: 40, out: 12, unit: 'Pcs', rackLocation: 'Zone A - Rack 12', condition: 'New', images: [] },
      { id: 'INV-1006', name: 'Royal Velvet Drapes (Maroon)', category: 'Fabrics & Drapes', total: 60, out: 20, unit: 'Rolls', rackLocation: 'Fabric Vault B', condition: 'Refurbished', images: [] }
    ];

    const INITIAL_WORKERS = [
      { id: 'WRK-001', name: 'Ramesh Kumar', type: 'Inhouse', role: 'Lead Stage Crew', status: 'Present', sitePresence: 'In Warehouse', dailyWage: 950 },
      { id: 'WRK-002', name: 'Suresh Naik', type: 'Inhouse', role: 'Fabric Decorator', status: 'Present', sitePresence: 'In Warehouse', dailyWage: 1100 },
      { id: 'WRK-003', name: 'Amit Sharma', type: 'Market Labour', role: 'Rigging Engineer', status: 'Present', sitePresence: 'Singhania Wedding', dailyWage: 1500 },
      { id: 'WRK-004', name: 'Vikram Singh', type: 'Market Labour', role: 'General Helper', status: 'Present', sitePresence: 'Tech Summit 2026', dailyWage: 750 },
      { id: 'WRK-005', name: 'Pooja Verma', type: 'Inhouse', role: 'Site Supervisor', status: 'Absent', sitePresence: 'Off Duty', dailyWage: 1300 }
    ];

    const INITIAL_PROJECTS = [
      { id: 'PRJ-501', clientName: 'Singhania Wedding', location: 'Grand Hyatt Lawn', eventDate: '2026-09-05', status: 'Ongoing' },
      { id: 'PRJ-502', clientName: 'Tech Summit 2026', location: 'Exhibition Center - Hall 3', eventDate: '2026-09-12', status: 'Upcoming' },
      { id: 'PRJ-503', clientName: 'Royal Gala Dinner', location: 'Taj Palace', eventDate: '2026-09-18', status: 'Upcoming' }
    ];

    const INITIAL_LEAVE_REQUESTS = [
      { id: 'LR-101', applicant: 'Ramesh Kumar', type: 'Casual Leave', dates: '2026-09-10 to 2026-09-12', reason: 'Family Function', status: 'Pending' },
      { id: 'LR-102', applicant: 'Suresh Naik', type: 'Medical Leave', dates: '2026-09-06', reason: 'Doctor Visit', status: 'Approved' }
    ];

    const INITIAL_EXPENSE_REQUESTS = [
      { id: 'EX-201', submitter: 'Amit Sharma', category: 'Site Transit Freight', amount: 3400, details: 'Tempo transport for Box Truss delivery', status: 'Pending' },
      { id: 'EX-202', submitter: 'Pooja Verma', category: 'Hardware Supplies', amount: 1250, details: 'Extra heavy-duty clamps and tie wires', status: 'Approved' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loginRole, setLoginRole] = useState('owner');
      const [pinInput, setPinInput] = useState('');

      // State persistence & Cloud sync configuration
      const [firebaseConfigStr, setFirebaseConfigStr] = useState(() => localStorage.getItem('dm_firebase_cfg_v10') || JSON.stringify({ apiKey: "AIzaSyDnRdJvNcoZBDD7nCNucl-WLCyymkw78Iw", authDomain: "dm-production-app.firebaseapp.com", databaseURL: "https://dm-production-app-default-rtdb.firebaseio.com", projectId: "dm-production-app", storageBucket: "dm-production-app.firebasestorage.app", messagingSenderId: "152552440620", appId: "1:152552440620:web:6dfd042c2c4f31d609e289" }));
      const [dbConnected, setDbConnected] = useState(false);
      const dbRef = useRef(null);

      const [rolePins, setRolePins] = useState(() => JSON.parse(localStorage.getItem('dm_pins_v10')) || DEFAULT_PINS);
      const [roleTitles, setRoleTitles] = useState(() => JSON.parse(localStorage.getItem('dm_role_titles_v10')) || DEFAULT_ROLE_TITLES);
      const [appLogo, setAppLogo] = useState(() => localStorage.getItem('dm_app_logo_v10') || null);

      const [fontFamily, setFontFamily] = useState(() => localStorage.getItem('dm_font_v10') || 'Inter');
      const [themeAccent, setThemeAccent] = useState(() => localStorage.getItem('dm_accent_v10') || '#f59e0b');
      const [bgStyle, setBgStyle] = useState(() => localStorage.getItem('dm_bg_v10') || '#0D0214');
      const [tabNames, setTabNames] = useState(() => JSON.parse(localStorage.getItem('dm_tabs_v10')) || DEFAULT_TAB_NAMES);

      const [activeTab, setActiveTab] = useState('dispatch');
      const [inventory, setInventory] = useState(() => JSON.parse(localStorage.getItem('dm_inventory_v10')) || INITIAL_INVENTORY);
      const [workers, setWorkers] = useState(() => JSON.parse(localStorage.getItem('dm_workers_v10')) || INITIAL_WORKERS);
      const [projects, setProjects] = useState(() => JSON.parse(localStorage.getItem('dm_projects_v10')) || INITIAL_PROJECTS);
      const [dispatchLogs, setDispatchLogs] = useState(() => JSON.parse(localStorage.getItem('dm_logs_v10')) || []);
      const [leaveRequests, setLeaveRequests] = useState(() => JSON.parse(localStorage.getItem('dm_leaves_v10')) || INITIAL_LEAVE_REQUESTS);
      const [expenseRequests, setExpenseRequests] = useState(() => JSON.parse(localStorage.getItem('dm_expenses_v10')) || INITIAL_EXPENSE_REQUESTS);

      const [selectedCatTab, setSelectedCatTab] = useState('Staging & Trusses');
      const [selectedItemId, setSelectedItemId] = useState('');
      const [dispatchQuantity, setDispatchQuantity] = useState(1);
      const [targetProject, setTargetProject] = useState(projects[0]?.clientName || 'General Site');
      const [actionType, setActionType] = useState('OUT');
      const [conditionPhoto, setConditionPhoto] = useState(null);

      // Modal & Editing States
      const [inspectItem, setInspectItem] = useState(null);
      const [editingItem, setEditingItem] = useState(null);
      const [editingEvent, setEditingEvent] = useState(null);
      const [newItem, setNewItem] = useState({ name: '', category: 'Staging & Trusses', total: 10, unit: 'Pcs', rackLocation: '', condition: 'New', images: [] });
      const [newWorker, setNewWorker] = useState({ name: '', type: 'Inhouse', role: 'Stage Crew', sitePresence: 'In Warehouse', dailyWage: 800 });
      const [newProject, setNewProject] = useState({ clientName: '', location: '', eventDate: '', status: 'Upcoming' });

      // HR / Office Forms
      const [newLeave, setNewLeave] = useState({ applicant: '', type: 'Casual Leave', dates: '', reason: '' });
      const [newExpense, setNewExpense] = useState({ submitter: '', category: 'Site Freight', amount: '', details: '' });

      const handleSaveEvent = (e) => {
    e.preventDefault();
    const updatedProjects = projects.map(p => p.id === editingEvent.id ? editingEvent : p);
    setProjects(updatedProjects);
    if (window.databaseRef) {
      window.databaseRef.child('projects').set(updatedProjects);
    }
    setEditingEvent(null);
  };
      const handleAddNewProject = (e) => {
    e.preventDefault();
    if (!newProject.clientName) return;
    const newItemWithId = { ...newProject, id: 'proj_' + Date.now() };
    const updatedProjects = [...projects, newItemWithId];
    setProjects(updatedProjects);
    if (window.databaseRef) {
      window.databaseRef.child('projects').set(updatedProjects);
    }
    setNewProject({ clientName: '', location: '', eventDate: '', status: 'Upcoming' });
  };
      
      // Initialize Realtime Cloud DB if configured
      useEffect(() => {
        if (!firebaseConfigStr) return;
        try {
          const config = JSON.parse(firebaseConfigStr);
          if (!firebase.apps.length) {
            firebase.initializeApp(config);
          }
          const database = firebase.database();
          window.databaseRef = database.ref();
          dbRef.current = database;
          setDbConnected(true);

          // RealtimeListeners
          database.ref('dm_portal_state').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              if (data.inventory) setInventory(data.inventory);
              if (data.workers) setWorkers(data.workers);
              if (data.projects) setProjects(data.projects);
              if (data.dispatchLogs) setDispatchLogs(data.dispatchLogs);
              if (data.leaveRequests) setLeaveRequests(data.leaveRequests);
              if (data.expenseRequests) setExpenseRequests(data.expenseRequests);
              if (data.rolePins) setRolePins(data.rolePins);
              if (data.roleTitles) setRoleTitles(data.roleTitles);
            }
          });
        } catch (err) {
          console.error("Firebase Connection Error:", err);
          setDbConnected(false);
        }
      }, [firebaseConfigStr]);

      // Push state changes to cloud/local storage
      const pushStateUpdate = (key, val, localKey) => {
        localStorage.setItem(localKey, JSON.stringify(val));
        if (dbRef.current && dbConnected) {
          dbRef.current.ref(`dm_portal_state/${key}`).set(val);
        }
      };

      useEffect(() => pushStateUpdate('inventory', inventory, 'dm_inventory_v10'), [inventory]);
      useEffect(() => pushStateUpdate('workers', workers, 'dm_workers_v10'), [workers]);
      useEffect(() => pushStateUpdate('projects', projects, 'dm_projects_v10'), [projects]);
      useEffect(() => pushStateUpdate('dispatchLogs', dispatchLogs, 'dm_logs_v10'), [dispatchLogs]);
      useEffect(() => pushStateUpdate('leaveRequests', leaveRequests, 'dm_leaves_v10'), [leaveRequests]);
      useEffect(() => pushStateUpdate('expenseRequests', expenseRequests, 'dm_expenses_v10'), [expenseRequests]);
      useEffect(() => pushStateUpdate('rolePins', rolePins, 'dm_pins_v10'), [rolePins]);
      useEffect(() => pushStateUpdate('roleTitles', roleTitles, 'dm_role_titles_v10'), [roleTitles]);

      useEffect(() => { localStorage.setItem('dm_font_v10', fontFamily); }, [fontFamily]);
      useEffect(() => { localStorage.setItem('dm_accent_v10', themeAccent); }, [themeAccent]);
      useEffect(() => { localStorage.setItem('dm_bg_v10', bgStyle); }, [bgStyle]);
      useEffect(() => { localStorage.setItem('dm_tabs_v10', JSON.stringify(tabNames)); }, [tabNames]);

      const categories = ['Staging & Trusses', 'Bar Structures', 'Fabrics & Drapes'];

      const isOwner = currentUser?.role === 'owner';
      const isPlanner = currentUser?.role === 'planner';
      const isFactory = currentUser?.role === 'factory_staff';
      const isOffice = currentUser?.role === 'office_staff';

      const canDispatch = isOwner || isPlanner || isFactory;
      const canManageCatalog = isOwner || isFactory;
      const canEditPersonnel = isOwner || isOffice;
      const canManageSettings = isOwner;

      const ongoingEventsCount = useMemo(() => projects.filter(p => p.status === 'Ongoing').length, [projects]);
      const upcomingEventsCount = useMemo(() => projects.filter(p => p.status === 'Upcoming').length, [projects]);
      const availableInhouseCount = useMemo(() => workers.filter(w => w.type === 'Inhouse' && w.status === 'Present').length, [workers]);
      const marketLaboursCount = useMemo(() => workers.filter(w => w.type === 'Market Labour').length, [workers]);

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAppLogo(reader.result);
            localStorage.setItem('dm_app_logo_v10', reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleWatermarkImageUpload = (file, callback) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          const img = new Image();
          img.src = reader.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            // Stamp Watermark Date/Time
            const timestamp = new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
            ctx.font = 'bold 24px Roboto Mono, monospace';
            ctx.fillStyle = 'rgba(245, 158, 11, 0.95)';
            ctx.fillRect(15, canvas.height - 50, ctx.measureText(timestamp).width + 20, 35);
            ctx.fillStyle = '#000000';
            ctx.fillText(timestamp, 25, canvas.height - 25);

            callback(canvas.toDataURL('image/jpeg', 0.85));
          };
        };
        reader.readAsDataURL(file);
      };

      const handleConditionPhotoCapture = (e) => {
        handleWatermarkImageUpload(e.target.files[0], (watermarkedImg) => {
          setConditionPhoto(watermarkedImg);
        });
      };

      const itemsInSelectedCategory = useMemo(() => {
        return inventory.filter(item => item.category === selectedCatTab);
      }, [inventory, selectedCatTab]);

      const activeSelectedItem = useMemo(() => {
        return inventory.find(i => i.id === selectedItemId) || itemsInSelectedCategory[0] || null;
      }, [inventory, selectedItemId, itemsInSelectedCategory]);

      useEffect(() => {
        if (itemsInSelectedCategory.length > 0) {
          setSelectedItemId(itemsInSelectedCategory[0].id);
        }
      }, [selectedCatTab]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (rolePins[loginRole] === pinInput) {
          setCurrentUser({ role: loginRole, title: roleTitles[loginRole] });
          setPinInput('');
          setActiveTab('dispatch');
        } else {
          alert('Invalid Security Authentication PIN Code.');
        }
      };

      const handleExecuteMovement = (e) => {
        e.preventDefault();
        if (!activeSelectedItem || dispatchQuantity <= 0) return;

        const delta = actionType === 'OUT' ? Number(dispatchQuantity) : -Number(dispatchQuantity);
        
        if (actionType === 'OUT' && (activeSelectedItem.total - activeSelectedItem.out) < dispatchQuantity) {
          alert('Cannot dispatch more than available warehouse stock!');
          return;
        }
        if (actionType === 'IN' && activeSelectedItem.out < dispatchQuantity) {
          alert('Cannot return more units than currently deployed OUT!');
          return;
        }

        const logTimestamp = new Date().toLocaleString();

        setInventory(prev => prev.map(item => {
          if (item.id === activeSelectedItem.id) {
            const updatedImages = conditionPhoto 
              ? [{ url: conditionPhoto, uploadedAt: logTimestamp }, ...(item.images || [])] 
              : (item.images || []);
            return { ...item, out: Math.max(0, item.out + delta), images: updatedImages };
          }
          return item;
        }));

        const logEntry = {
          id: 'LOG-' + Date.now(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          itemName: activeSelectedItem.name,
          qty: dispatchQuantity,
          type: actionType,
          project: targetProject,
          by: currentUser.title,
          conditionPhoto: conditionPhoto
        };

        setDispatchLogs(logs => [logEntry, ...logs]);
        setDispatchQuantity(1);
        setConditionPhoto(null);
      };

      // Add & Edit Inventory Handlers
      const handleSaveInventoryItem = (e) => {
        e.preventDefault();
        if (!newItem.name) return;

        if (editingItem) {
          setInventory(inventory.map(item => item.id === editingItem.id ? { ...newItem, id: editingItem.id, out: editingItem.out } : item));
          setEditingItem(null);
        } else {
          setInventory([...inventory, { ...newItem, id: 'INV-' + (1000 + inventory.length + 1), total: Number(newItem.total), out: 0 }]);
        }
        setNewItem({ name: '', category: 'Staging & Trusses', total: 10, unit: 'Pcs', rackLocation: '', condition: 'New', images: [] });
      };

      const startEditingItem = (item) => {
        setEditingItem(item);
        setNewItem({ ...item });
        setActiveTab('catalog');
      };

      const handleAddWorker = (e) => {
        e.preventDefault();
        if (!newWorker.name) return;
        setWorkers([...workers, { ...newWorker, id: 'WRK-' + (100 + workers.length + 1), status: 'Present', dailyWage: Number(newWorker.dailyWage) }]);
        setNewWorker({ name: '', type: 'Inhouse', role: 'Stage Crew', sitePresence: 'In Warehouse', dailyWage: 800 });
      };

      const handleAddProject = (e) => {
        e.preventDefault();
        if (!newProject.clientName) return;
        setProjects([...projects, { ...newProject, id: 'PRJ-' + (500 + projects.length + 1) }]);
        setNewProject({ clientName: '', location: '', eventDate: '', status: 'Upcoming' });
      };

      const handleAddLeave = (e) => {
        e.preventDefault();
        if (!newLeave.applicant) return;
        setLeaveRequests([{ ...newLeave, id: 'LR-' + (100 + leaveRequests.length + 1), status: 'Pending' }, ...leaveRequests]);
        setNewLeave({ applicant: '', type: 'Casual Leave', dates: '', reason: '' });
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!newExpense.submitter) return;
        setExpenseRequests([{ ...newExpense, id: 'EX-' + (200 + expenseRequests.length + 1), amount: Number(newExpense.amount), status: 'Pending' }, ...expenseRequests]);
        setNewExpense({ submitter: '', category: 'Site Freight', amount: '', details: '' });
      };

      const handleUpdateLeaveStatus = (id, status) => {
        setLeaveRequests(leaveRequests.map(l => l.id === id ? { ...l, status } : l));
      };

      const handleUpdateExpenseStatus = (id, status) => {
        setExpenseRequests(expenseRequests.map(e => e.id === id ? { ...e, status } : e));
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[#0D0214]" style={{ fontFamily }}>
            <div className="w-full max-w-sm bg-[#1B0626] border border-purple-800/80 rounded-3xl p-6 space-y-6 shadow-2xl">
              <div className="text-center">
                {appLogo ? (
                  <img src={appLogo} className="w-20 h-20 rounded-2xl mx-auto mb-3 object-contain bg-[#0D0214] p-1 border-2 border-amber-400 shadow-lg" />
                ) : (
                  <div className="w-16 h-16 bg-amber-500 rounded-2xl flex items-center justify-center text-black font-black text-2xl mx-auto mb-3 shadow-lg">★</div>
                )}
                <h1 className="text-xl font-black text-amber-400">D M PRODUCTIONS</h1>
                <p className="text-[11px] text-purple-300 font-bold uppercase tracking-widest mt-0.5">Operations Control Login</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-purple-300 mb-1 uppercase">Select Access Role</label>
                  <select value={loginRole} onChange={e => setLoginRole(e.target.value)} className="w-full bg-[#0D0214] text-white border border-purple-700/80 rounded-xl px-3 py-2.5 text-sm font-semibold">
                    <option value="owner">{roleTitles.owner}</option>
                    <option value="planner">{roleTitles.planner}</option>
                    <option value="factory_staff">{roleTitles.factory_staff}</option>
                    <option value="office_staff">{roleTitles.office_staff}</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-purple-300 mb-1 uppercase">Enter Security PIN</label>
                  <input type="password" placeholder="••••" value={pinInput} onChange={e => setPinInput(e.target.value)} className="w-full bg-[#0D0214] text-amber-400 border border-purple-700/80 rounded-xl px-3 py-2 text-center text-2xl font-black tracking-widest" />
                </div>

                <button type="submit" className="w-full py-3.5 text-black font-black rounded-xl text-sm shadow-lg transition hover:brightness-110" style={{ backgroundColor: themeAccent }}>
                  AUTHORIZE LOG IN
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12" style={{ fontFamily, backgroundColor: bgStyle }}>
          {/* HEADER */}
          <header className="bg-[#1B0626] border-b border-purple-900/80 px-6 py-3 flex justify-between items-center sticky top-0 z-40 shadow-xl">
            <div className="flex items-center gap-3">
              {appLogo ? (
                <img src={appLogo} className="w-10 h-10 rounded-xl object-contain bg-[#0D0214] p-0.5 border" style={{ borderColor: themeAccent }} />
              ) : (
                <div className="w-9 h-9 rounded-xl flex items-center justify-center text-black font-black text-lg" style={{ backgroundColor: themeAccent }}>★</div>
              )}
              <div>
                <h1 className="font-black text-base leading-none" style={{ color: themeAccent }}>D M PRODUCTIONS</h1>
                <p className="text-[10px] text-purple-300 font-bold mt-0.5">{currentUser.title}</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {dbConnected && (
                <span className="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-950/80 border border-emerald-700 rounded-lg text-[10px] font-bold text-emerald-400">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Live
                </span>
              )}
              <button onClick={() => setCurrentUser(null)} className="px-3.5 py-1.5 bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/60 rounded-xl text-xs font-bold transition">
                Logout Session
              </button>
            </div>
          </header>

          {/* MAIN NAVIGATION TABS */}
          <div className="bg-[#13031C] border-b border-purple-900/60 px-6 py-2.5 flex gap-2 overflow-x-auto">
            {canDispatch && (
              <button onClick={() => setActiveTab('dispatch')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeTab === 'dispatch' ? 'text-black font-extrabold' : 'bg-[#20072E] text-purple-200 hover:bg-purple-900/40'}`} style={activeTab === 'dispatch' ? { backgroundColor: themeAccent } : {}}>
                {tabNames.dispatch}
              </button>
            )}
            <button onClick={() => setActiveTab('overview')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeTab === 'overview' ? 'text-black font-extrabold' : 'bg-[#20072E] text-purple-200 hover:bg-purple-900/40'}`} style={activeTab === 'overview' ? { backgroundColor: themeAccent } : {}}>
              {tabNames.overview}

                        <input type="text" placeholder="Applicant Name" value={newLeave.applicant} onChange={e => setNewLeave({ ...newLeave, applicant: e.target.value })} className="w-full bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs" />
                        <div className="grid grid-cols-2 gap-2">
                          <select value={newLeave.type} onChange={e => setNewLeave({ ...newLeave, type: e.target.value })} className="bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs">
                            <option value="Casual Leave">Casual Leave</option>
                            <option value="Medical Leave">Medical Leave</option>
                            <option value="Earned Leave">Earned Leave</option>
                          </select>
                          <input type="text" placeholder="Dates (e.g. 10 Sep - 12 Sep)" value={newLeave.dates} onChange={e => setNewLeave({ ...newLeave, dates: e.target.value })} className="bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs" />
                        </div>
                        <input type="text" placeholder="Reason" value={newLeave.reason} onChange={e => setNewLeave({ ...newLeave, reason: e.target.value })} className="w-full bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs" />
                        <button type="submit" className="w-full py-2 bg-purple-800 hover:bg-purple-700 text-purple-100 font-bold text-xs rounded-lg">Submit Leave Request</button>
                      </form>

                      <div className="mt-4 space-y-2">
                        <h5 className="text-[11px] font-bold text-purple-400 uppercase">Leave Requests Approval Queue</h5>
                        {leaveRequests.map(l => (
                          <div key={l.id} className="p-2.5 bg-[#1B0626] rounded-lg border border-purple-900/80 flex justify-between items-center text-xs">
                            <div>
                              <p className="font-bold text-white">{l.applicant} ({l.type})</p>
                              <p className="text-[10px] text-purple-300">{l.dates} — {l.reason}</p>
                            </div>
                            {canEditPersonnel && l.status === 'Pending' ? (
                              <div className="flex gap-1">
                                <button onClick={() => handleUpdateLeaveStatus(l.id, 'Approved')} className="px-2 py-1 bg-emerald-600 text-white rounded text-[10px] font-bold">Approve</button>
                                <button onClick={() => handleUpdateLeaveStatus(l.id, 'Rejected')} className="px-2 py-1 bg-rose-600 text-white rounded text-[10px] font-bold">Reject</button>
                              </div>
                            ) : (
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${l.status === 'Approved' ? 'bg-emerald-950 text-emerald-400' : l.status === 'Rejected' ? 'bg-rose-950 text-rose-400' : 'bg-amber-950 text-amber-400'}`}>{l.status}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* EXPENSE & PETTY CASH APPROVALS */}
                    <div className="bg-[#0D0214] p-4 rounded-xl border border-purple-800/80 space-y-3">
                      <h4 className="text-xs font-bold text-purple-200 uppercase">💸 Submit Site Expense / Freight Claim</h4>
                      <form onSubmit={handleAddExpense} className="space-y-2">
                        <input type="text" placeholder="Submitter / Crew Lead" value={newExpense.submitter} onChange={e => setNewExpense({ ...newExpense, submitter: e.target.value })} className="w-full bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs" />
                        <div className="grid grid-cols-2 gap-2">
                          <input type="text" placeholder="Category (Transit, Screws, etc.)" value={newExpense.category} onChange={e => setNewExpense({ ...newExpense, category: e.target.value })} className="bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs" />
                          <input type="number" placeholder="Amount (₹)" value={newExpense.amount} onChange={e => setNewExpense({ ...newExpense, amount: e.target.value })} className="bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs font-mono" />
                        </div>
                        <input type="text" placeholder="Details / Remarks" value={newExpense.details} onChange={e => setNewExpense({ ...newExpense, details: e.target.value })} className="w-full bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs" />
                        <button type="submit" className="w-full py-2 bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs rounded-lg">Submit Claim for Approval</button>
                      </form>

                      <div className="mt-4 space-y-2">
                        <h5 className="text-[11px] font-bold text-purple-400 uppercase">Expense Claims Approval Queue</h5>
                        {expenseRequests.map(ex => (
                          <div key={ex.id} className="p-2.5 bg-[#1B0626] rounded-lg border border-purple-900/80 flex justify-between items-center text-xs">
                            <div>
                              <p className="font-bold text-white">{ex.submitter} — <span className="text-amber-400 font-mono">₹{ex.amount}</span></p>
                              <p className="text-[10px] text-purple-300">{ex.category}: {ex.details}</p>
                            </div>
                            {canEditPersonnel && ex.status === 'Pending' ? (
                              <div className="flex gap-1">
                                <button onClick={() => handleUpdateExpenseStatus(ex.id, 'Approved')} className="px-2 py-1 bg-emerald-600 text-white rounded text-[10px] font-bold">Approve</button>
                                <button onClick={() => handleUpdateExpenseStatus(ex.id, 'Rejected')} className="px-2 py-1 bg-rose-600 text-white rounded text-[10px] font-bold">Reject</button>
                              </div>
                            ) : (
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${ex.status === 'Approved' ? 'bg-emerald-950 text-emerald-400' : ex.status === 'Rejected' ? 'bg-rose-950 text-rose-400' : 'bg-amber-950 text-amber-400'}`}>{ex.status}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: EVENTS & SITES */}
            {activeTab === 'projects' && (
              <div className="space-y-5">
                {canManageCatalog && (
                  <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                    <h3 className="text-base font-bold text-emerald-400">➕ Add New Event / Target Site</h3>
                    <form onSubmit={handleAddNewProject} className="grid grid-cols-1 md:grid-cols-4 gap-3">
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Client Name</label>
                        <input type="text" placeholder="e.g. Acme Corp Gala" value={newProject.clientName} onChange={e => setNewProject({ ...newProject, clientName: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Location</label>
                        <input type="text" placeholder="e.g. Grand Ballroom" value={newProject.location} onChange={e => setNewProject({ ...newProject, location: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Event Date</label>
                        <input type="text" placeholder="YYYY-MM-DD" value={newProject.eventDate} onChange={e => setNewProject({ ...newProject, eventDate: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Status</label>
                        <select value={newProject.status} onChange={e => setNewProject({ ...newProject, status: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold">
                          <option value="Upcoming">Upcoming</option>
                          <option value="Ongoing">Ongoing</option>
                          <option value="Completed">Completed</option>
                        </select>
                      </div>
                      <div className="md:col-span-4">
                        <button type="submit" className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs rounded-xl transition uppercase">
                          Add New Event
                        </button>
                      </div>
                    </form>
                  </div>
                )}

                {/* Event Editor Form with Safe Fallbacks */}
                {canManageCatalog && editingEvent && (
                  <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                    <div className="flex justify-between items-center border-b border-purple-900/80 pb-3">
                      <h3 className="text-base font-bold text-emerald-400">✏️ Edit Event: {editingEvent.clientName || 'Event'}</h3>
                      <button onClick={() => setEditingEvent(null)} className="px-3 py-1 bg-purple-900 text-purple-200 text-xs font-bold rounded-lg">Cancel</button>
                    </div>
                    <form onSubmit={handleSaveEvent} className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Client Name</label>
                        <input type="text" value={editingEvent.clientName || ''} onChange={e => setEditingEvent({ ...editingEvent, clientName: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Location</label>
                        <input type="text" value={editingEvent.location || ''} onChange={e => setEditingEvent({ ...editingEvent, location: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Event Date</label>
                        <input type="text" value={editingEvent.eventDate || ''} onChange={e => setEditingEvent({ ...editingEvent, eventDate: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-purple-300 uppercase mb-1">Status</label>
                        <select value={editingEvent.status || 'Upcoming'} onChange={e => setEditingEvent({ ...editingEvent, status: e.target.value })} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl px-3 py-2 text-xs font-bold">
                          <option value="Ongoing">Ongoing</option>
                          <option value="Upcoming">Upcoming</option>
                          <option value="Completed">Completed</option>
                        </select>
                      </div>
                      <div className="md:col-span-3">
                        <button type="submit" className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs rounded-xl transition uppercase">Save Event Changes</button>
                      </div>
                    </form>
                  </div>
                )}

                {/* Events Display Grid */}
                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                  <h3 className="text-base font-bold text-emerald-400">🎪 Events & Active Target Sites</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {projects.map(p => (
                      <div key={p.id} className="bg-[#0D0214] p-4 rounded-xl border border-purple-800 space-y-2 flex flex-col justify-between">
                        <div className="space-y-2">
                          <div className="flex justify-between items-start">
                            <h4 className="font-extrabold text-sm text-white">{p.clientName}</h4>
                            <span className={`px-2 py-0.5 rounded text-[10px] font-black ${p.status === 'Ongoing' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}`}>{p.status}</span>
                          </div>
                          <p className="text-xs text-purple-300">📍 Location: {p.location}</p>
                          <p className="text-xs text-purple-400 font-mono">📅 Event Date: {p.eventDate}</p>
                        </div>
                        {canManageCatalog && (
                          <div className="pt-2 text-right border-t border-purple-900/40">
                            <button onClick={() => setEditingEvent(p)} className="px-3 py-1 bg-purple-900 hover:bg-purple-800 text-emerald-300 rounded-lg font-bold text-[11px] border border-purple-700">
                              ✏️ Edit Event
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
            
            {/* TAB: SETTINGS & OWNER CONTROL PANEL */}
            {activeTab === 'settings' && canManageSettings && (
              <div className="space-y-6">
                {/* CLOUD DATABASE SYNC CONTROL */}
                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                  <h3 className="text-base font-bold text-amber-400">⚡ Cross-Device Firebase Real-time Cloud Sync Configuration</h3>
                  <p className="text-xs text-purple-300">Paste your Firebase Realtime Database Web JSON config below to enable instant multi-device state synchronization across all phones and tablets.</p>
                  <textarea
                    rows="4"
                    placeholder='{"apiKey": "...", "authDomain": "...", "databaseURL": "https://...", "projectId": "..."}'
                    value={firebaseConfigStr}
                    onChange={e => {
                      setFirebaseConfigStr(e.target.value);
                      localStorage.setItem('dm_firebase_cfg_v10', e.target.value);
                    }}
                    className="w-full bg-[#0D0214] text-emerald-400 font-mono text-xs border border-purple-800 rounded-xl p-3"
                  />
                  {dbConnected && <p className="text-xs text-emerald-400 font-bold">✅ Firebase Realtime Sync Engine Active & Connected!</p>}
                </div>

                {/* OWNER-ONLY SECURITY PIN & ROLE TITLE EDITING */}
                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                  <h3 className="text-base font-bold text-amber-400">👑 Role Management & Security Authentication PIN Control</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {Object.keys(rolePins).map(roleKey => (
                      <div key={roleKey} className="bg-[#0D0214] p-4 rounded-xl border border-purple-800/80 space-y-2">
                        <label className="block text-xs font-bold text-purple-300 uppercase">{roleKey.replace('_', ' ')} Settings</label>
                        <div className="space-y-2">
                          <input
                            type="text"
                            placeholder="Custom Role Title"
                            value={roleTitles[roleKey]}
                            onChange={e => setRoleTitles({ ...roleTitles, [roleKey]: e.target.value })}
                            className="w-full bg-[#13031C] text-white border border-purple-800 rounded-lg p-2 text-xs font-bold"
                          />
                          <input
                            type="password"
                            placeholder="Access PIN"
                            value={rolePins[roleKey]}
                            onChange={e => setRolePins({ ...rolePins, [roleKey]: e.target.value })}
                            className="w-full bg-[#13031C] text-amber-400 font-mono text-center font-bold border border-purple-800 rounded-lg p-2 text-sm"
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* GLOBAL BRANDING & LOGO */}
                <div className="bg-[#1B0626] p-6 rounded-2xl border border-purple-800/80 space-y-4">
                  <h3 className="text-base font-bold text-amber-400">🎨 Enterprise Branding & UI Settings</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-purple-300 uppercase mb-1">Upload Company Logo</label>
                      <input type="file" accept="image/*" onChange={handleLogoUpload} className="text-xs text-purple-300" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-purple-300 uppercase mb-1">Global Typography</label>
                      <select value={fontFamily} onChange={e => setFontFamily(e.target.value)} className="w-full bg-[#0D0214] text-white border border-purple-800 rounded-xl p-2 text-xs font-bold">
                        <option value="Inter">Inter</option>
                        <option value="Poppins">Poppins</option>
                        <option value="Roboto Mono">Roboto Mono</option>
                        <option value="Cinzel">Cinzel</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-purple-300 uppercase mb-1">Theme Accent Color</label>
                      <input type="color" value={themeAccent} onChange={e => setThemeAccent(e.target.value)} className="w-full h-9 bg-[#0D0214] border border-purple-800 rounded-xl p-1 cursor-pointer" />
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* ITEM DETAIL INSPECTION MODAL WITH WATERMARKED HISTORICAL PHOTOS */}
          {inspectItem && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#1B0626] border border-amber-500/80 w-full max-w-2xl rounded-3xl p-6 space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start border-b border-purple-800 pb-3">
                  <div>
                    <h3 className="text-lg font-black text-amber-400">{inspectItem.name}</h3>
                    <p className="text-xs text-purple-300 font-mono">ID: {inspectItem.id} | Category: {inspectItem.category}</p>
                  </div>
                  <button onClick={() => setInspectItem(null)} className="px-3 py-1 bg-rose-950 text-rose-300 border border-rose-800 rounded-xl text-xs font-bold">
                    Close ✕
                  </button>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-[#0D0214] p-4 rounded-2xl border border-purple-800 text-center text-xs">
                  <div>
                    <p className="text-[10px] text-purple-400 font-bold uppercase">Condition</p>
                    <p className="font-extrabold text-amber-400 mt-1">{inspectItem.condition || 'New'}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-purple-400 font-bold uppercase">Rack Location</p>
                    <p className="font-extrabold text-white mt-1 font-mono">{inspectItem.rackLocation}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-purple-400 font-bold uppercase">Ready in Warehouse</p>
                    <p className="font-extrabold text-emerald-400 mt-1">{inspectItem.total - inspectItem.out} {inspectItem.unit}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-purple-400 font-bold uppercase">Deployed OUT</p>
                    <p className="font-extrabold text-amber-400 mt-1">{inspectItem.out} {inspectItem.unit}</p>
                  </div>
                </div>

                <div>
                  <h4 className="text-xs font-bold text-purple-200 uppercase mb-3">📷 Historical Photo Audit Logs (Latest to Oldest)</h4>
                  {inspectItem.images && inspectItem.images.length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {inspectItem.images.map((imgObj, idx) => (
                        <div key={idx} className="bg-[#0D0214] p-2 rounded-xl border border-purple-800 space-y-1">
                          <img src={imgObj.url} className="w-full h-40 object-cover rounded-lg border border-purple-700" />
                          <p className="text-[10px] font-mono text-amber-400 text-center">Uploaded: {imgObj.uploadedAt}</p>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="bg-[#0D0214] p-6 text-center text-xs text-purple-400 rounded-2xl border border-purple-800">
                      No historical photo condition logs recorded for this item yet.
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
