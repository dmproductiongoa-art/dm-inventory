<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D M PRODUCTIONS Warehouse & Inventory Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#14031D] text-white antialiased selection:bg-amber-500 selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Default Seed Data
    const INITIAL_INVENTORY = [
      { id: '1', name: 'Staging Angle Ply (8x4 ft)', category: 'Staging & Trusses', total: 100, out: 0, maintenance: 0, image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80', unit: 'Pcs' },
      { id: '2', name: 'Aluminum Box Truss (10ft)', category: 'Staging & Trusses', total: 40, out: 12, maintenance: 1, image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop&q=80', unit: 'Pcs' },
      { id: '3', name: 'Royal Velvet Drapes (Maroon)', category: 'Fabrics & Drapes', total: 60, out: 20, maintenance: 2, image: 'https://images.unsplash.com/photo-1519741497674-611481863552?w=300&auto=format&fit=crop&q=80', unit: 'Rolls' },
      { id: '4', name: 'Brass Mandap Pillars', category: 'Wedding Decor & Props', total: 16, out: 8, maintenance: 0, image: 'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=300&auto=format&fit=crop&q=80', unit: 'Sets' },
      { id: '5', name: 'Gold Mirror Island Bar', category: 'Bar Structures', total: 4, out: 2, maintenance: 0, image: 'https://images.unsplash.com/photo-1572116469696-31de0f17cc34?w=300&auto=format&fit=crop&q=80', unit: 'Units' },
      { id: '6', name: 'Crystal Chandelier (Large)', category: 'Detailing Props', total: 12, out: 4, maintenance: 1, image: 'https://images.unsplash.com/photo-1543198181-e619b692b11c?w=300&auto=format&fit=crop&q=80', unit: 'Pcs' },
      { id: '7', name: 'Chesterfield Velvet Sofa (Gold)', category: 'Furniture & Lounges', total: 10, out: 4, maintenance: 0, image: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=300&auto=format&fit=crop&q=80', unit: 'Pcs' },
    ];

    const INITIAL_EVENTS = [
      { id: 'evt-101', name: 'Sharma Destination Wedding', venue: 'Grand Hyatt, Goa', date: '2026-09-12', status: 'Active', dispatches: { '1': 30, '3': 20, '4': 8, '5': 2 } },
      { id: 'evt-102', name: 'Sunburn Pre-Party Bar Setup', venue: 'Vagator Beach Club', date: '2026-09-18', status: 'Upcoming', dispatches: { '2': 12, '5': 1, '6': 4 } },
    ];

    function App() {
      const [role, setRole] = useState('manager');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('dm_inventory');
        return saved ? JSON.parse(saved) : INITIAL_INVENTORY;
      });
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('dm_events');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });

      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedEventId, setSelectedEventId] = useState(INITIAL_EVENTS[0].id);
      const [dispatchCart, setDispatchCart] = useState({});

      useEffect(() => {
        localStorage.setItem('dm_inventory', JSON.stringify(inventory));
      }, [inventory]);

      useEffect(() => {
        localStorage.setItem('dm_events', JSON.stringify(events));
      }, [events]);

      const categories = ['All', 'Staging & Trusses', 'Wedding Decor & Props', 'Fabrics & Drapes', 'Bar Structures', 'Detailing Props', 'Furniture & Lounges'];

      // Metrics
      const totalStockCount = useMemo(() => inventory.reduce((acc, item) => acc + item.total, 0), [inventory]);
      const totalOutCount = useMemo(() => inventory.reduce((acc, item) => acc + item.out, 0), [inventory]);
      const totalMaintCount = useMemo(() => inventory.reduce((acc, item) => acc + item.maintenance, 0), [inventory]);
      const totalAvailableCount = totalStockCount - totalOutCount - totalMaintCount;

      const filteredInventory = useMemo(() => {
        return inventory.filter(item => {
          const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
          const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
          return matchesCat && matchesSearch;
        });
      }, [inventory, selectedCategory, searchTerm]);

      const handleCartChange = (itemId, qty, maxAvail) => {
        const val = Math.max(0, Math.min(qty, maxAvail));
        setDispatchCart(prev => ({ ...prev, [itemId]: val }));
      };

      const handleConfirmDispatch = () => {
        if (Object.keys(dispatchCart).length === 0) return;
        
        // Update Inventory
        setInventory(prev => prev.map(item => {
          const qtyToDispatch = dispatchCart[item.id] || 0;
          return { ...item, out: item.out + qtyToDispatch };
        }));

        // Update Event
        setEvents(prev => prev.map(evt => {
          if (evt.id === selectedEventId) {
            const updatedDispatches = { ...evt.dispatches };
            Object.entries(dispatchCart).forEach(([itemId, qty]) => {
              if (qty > 0) {
                updatedDispatches[itemId] = (updatedDispatches[itemId] || 0) + qty;
              }
            });
            return { ...evt, dispatches: updatedDispatches };
          }
          return evt;
        }));

        setDispatchCart({});
        alert('Dispatch confirmed and synchronized!');
      };

      const handleExportCSV = () => {
        let csv = 'ID,Item Name,Category,Total Stock,Out at Events,Maintenance,Available\n';
        inventory.forEach(i => {
          const avail = i.total - i.out - i.maintenance;
          csv += `"${i.id}","${i.name}","${i.category}",${i.total},${i.out},${i.maintenance},${avail}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `DM_Productions_Inventory_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
      };

      const triggerWhatsAppAlert = (item) => {
        const avail = item.total - item.out - item.maintenance;
        const msg = encodeURIComponent(`🚨 *DM PRODUCTIONS LOW STOCK ALERT*\n\nItem: ${item.name}\nAvailable in Workshop: ${avail} ${item.unit}\nTotal Stock: ${item.total}\nCurrently Out on Site: ${item.out}\n\nPlease recheck workshop allocation.`);
        window.open(`https://wa.me/?text=${msg}`, '_blank');
      };

      return (
        <div className="min-h-screen pb-12">
          {/* Header */}
          <header className="bg-[#20072C] border-b border-[#3D1152] sticky top-0 z-50 px-4 py-3 shadow-xl">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-amber-300 via-amber-500 to-amber-700 flex items-center justify-center shadow-lg shadow-amber-500/20">
                  <svg className="w-6 h-6 text-[#14031D] fill-current" viewBox="0 0 24 24">
                    <path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7-6.3-4.6-6.3 4.6 2.3-7-6-4.6h7.6z"/>
                  </svg>
                </div>
                <div>
                  <h1 className="font-extrabold text-lg tracking-wider text-amber-400 leading-none">D M PRODUCTIONS</h1>
                  <p className="text-[10px] text-purple-300 tracking-widest uppercase mt-0.5">Our Precision, Your Perfect Event • GOA</p>
                </div>
              </div>

              {/* Role Toggle Switch */}
              <div className="flex items-center bg-[#14031D] p-1 rounded-full border border-purple-900/60">
                <button
                  onClick={() => setRole('staff')}
                  className={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${role === 'staff' ? 'bg-amber-500 text-black shadow-md' : 'text-purple-300 hover:text-white'}`}
                >
                  👷 Staff
                </button>
                <button
                  onClick={() => setRole('manager')}
                  className={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${role === 'manager' ? 'bg-amber-500 text-black shadow-md' : 'text-purple-300 hover:text-white'}`}
                >
                  👑 Manager
                </button>
              </div>
            </div>
          </header>

          {/* Navigation Bar */}
          <div className="bg-[#1A0524] border-b border-purple-900/40 px-4 py-2 sticky top-[61px] z-40">
            <div className="max-w-7xl mx-auto flex items-center justify-between overflow-x-auto gap-2 no-scrollbar">
              <div className="flex gap-2">
                {[
                  { id: 'dashboard', label: '📊 Dashboard' },
                  { id: 'dispatch', label: '🚚 Dispatch (OUT)' },
                  { id: 'return', label: '📥 Return (IN)' },
                  { id: 'catalog', label: '📦 Catalog' },
                  { id: 'events', label: '📍 Active Events' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === tab.id ? 'bg-gradient-to-r from-purple-800 to-purple-950 text-amber-300 border border-amber-500/40 shadow-lg' : 'bg-[#250833] text-purple-200 hover:bg-purple-900/50'}`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              {role === 'manager' && (
                <button 
                  onClick={handleExportCSV}
                  className="px-3 py-2 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md transition-all shrink-0 ml-2"
                >
                  📥 Export CSV
                </button>
              )}
            </div>
          </div>

          <main className="max-w-7xl mx-auto px-4 mt-6">
            
            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                {/* Stats Grid */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-[#22082E] p-4 rounded-2xl border border-purple-800/40 shadow-lg">
                    <p className="text-xs text-purple-300 font-medium">Total Workshop Stock</p>
                    <p className="text-3xl font-black text-white mt-1">{totalStockCount}</p>
                    <span className="text-[10px] text-purple-400">All registered props</span>
                  </div>
                  <div className="bg-[#22082E] p-4 rounded-2xl border border-emerald-500/30 shadow-lg">
                    <p className="text-xs text-emerald-400 font-medium">Available in Workshop</p>
                    <p className="text-3xl font-black text-emerald-400 mt-1">{totalAvailableCount}</p>
                    <span className="text-[10px] text-emerald-300/80">Ready for dispatch</span>
                  </div>
                  <div className="bg-[#22082E] p-4 rounded-2xl border border-amber-500/30 shadow-lg">
                    <p className="text-xs text-amber-400 font-medium">Deployed at Events</p>
                    <p className="text-3xl font-black text-amber-400 mt-1">{totalOutCount}</p>
                    <span className="text-[10px] text-amber-300/80">On location sites</span>
                  </div>
                  <div className="bg-[#22082E] p-4 rounded-2xl border border-rose-500/30 shadow-lg">
                    <p className="text-xs text-rose-400 font-medium">Damaged / Maintenance</p>
                    <p className="text-3xl font-black text-rose-400 mt-1">{totalMaintCount}</p>
                    <span className="text-[10px] text-rose-300/80">Needs repair/inspection</span>
                  </div>
                </div>

                {/* Low Stock WhatsApp Alerts Section */}
                <div className="bg-[#22082E] p-5 rounded-2xl border border-amber-500/20 shadow-xl">
                  <h3 className="font-bold text-amber-400 text-sm flex items-center gap-2 mb-3">
                    ⚠️ Low Workshop Stock Alerts
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {inventory.filter(i => (i.total - i.out - i.maintenance) <= 10).map(item => {
                      const avail = item.total - item.out - item.maintenance;
                      return (
                        <div key={item.id} className="bg-[#170420] p-3 rounded-xl border border-rose-900/50 flex items-center justify-between">
                          <div>
                            <p className="font-bold text-sm text-white">{item.name}</p>
                            <p className="text-xs text-rose-400 font-semibold">Only {avail} {item.unit} remaining in workshop</p>
                          </div>
                          <button
                            onClick={() => triggerWhatsAppAlert(item)}
                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md transition-all"
                          >
                            💬 WhatsApp Manager
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Quick Catalog Quick View */}
                <div>
                  <h3 className="font-extrabold text-lg text-white mb-3">Recent Stock Movement Overview</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {inventory.map(item => {
                      const avail = item.total - item.out - item.maintenance;
                      const availPct = Math.round((avail / item.total) * 100);
                      return (
                        <div key={item.id} className="bg-[#20072C] p-4 rounded-2xl border border-purple-800/30 shadow-lg flex gap-4 items-center">
                          <img src={item.image} alt={item.name} className="w-20 h-20 rounded-xl object-cover border border-purple-700/40 shrink-0" />
                          <div className="flex-1 min-w-0">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-md">{item.category}</span>
                            <h4 className="font-bold text-sm text-white truncate mt-1">{item.name}</h4>
                            <div className="w-full bg-purple-950 rounded-full h-2 mt-2 overflow-hidden border border-purple-800/40">
                              <div className="bg-gradient-to-r from-amber-500 to-emerald-400 h-2 rounded-full" style={{ width: `${availPct}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[11px] mt-1.5 text-purple-200">
                              <span>Workshop: <strong className="text-emerald-400">{avail}</strong></span>
                              <span>Out: <strong className="text-amber-400">{item.out}</strong></span>
                              <span>Total: <strong>{item.total}</strong></span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: DISPATCH (OUT) */}
            {activeTab === 'dispatch' && (
              <div className="space-y-6">
                <div className="bg-[#20072C] p-5 rounded-2xl border border-purple-800/40 shadow-xl">
                  <h2 className="text-lg font-extrabold text-amber-400 mb-2">Step 1: Select Event Location</h2>
                  <select 
                    value={selectedEventId} 
                    onChange={(e) => setSelectedEventId(e.target.value)}
                    className="w-full bg-[#14031D] text-white border border-purple-700 rounded-xl px-4 py-3 text-sm font-semibold focus:outline-none focus:border-amber-400"
                  >
                    {events.map(evt => (
                      <option key={evt.id} value={evt.id}>📍 {evt.name} — ({evt.venue})</option>
                    ))}
                  </select>
                </div>

                <div className="bg-[#20072C] p-5 rounded-2xl border border-purple-800/40 shadow-xl">
                  <h2 className="text-lg font-extrabold text-amber-400 mb-4">Step 2: Select Items to Dispatch OUT</h2>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {inventory.map(item => {
                      const avail = item.total - item.out - item.maintenance;
                      const inCart = dispatchCart[item.id] || 0;

                      return (
                        <div key={item.id} className="bg-[#170420] p-4 rounded-2xl border border-purple-900/60 flex gap-4">
                          <img src={item.image} alt={item.name} className="w-20 h-20 rounded-xl object-cover shrink-0" />
                          <div className="flex-1 min-w-0">
                            <h4 className="font-bold text-sm text-white truncate">{item.name}</h4>
                            <p className="text-xs text-emerald-400 font-semibold mt-0.5">Available in Workshop: {avail} {item.unit}</p>

                            {/* Touch Stepper & Quick Presets */}
                            <div className="mt-3 flex items-center gap-2">
                              <button 
                                onClick={() => handleCartChange(item.id, inCart - 1, avail)}
                                className="w-9 h-9 bg-purple-900/80 hover:bg-purple-800 text-amber-400 rounded-xl font-black text-lg flex items-center justify-center border border-purple-700 active:scale-95"
                              >
                                -
                              </button>
                              <span className="w-10 text-center font-black text-amber-400 text-base">{inCart}</span>
                              <button 
                                onClick={() => handleCartChange(item.id, inCart + 1, avail)}
                                className="w-9 h-9 bg-amber-500 hover:bg-amber-400 text-black rounded-xl font-black text-lg flex items-center justify-center shadow-lg active:scale-95"
                              >
                                +
                              </button>

                              {/* Quick Bulk Presets */}
                              <div className="flex gap-1 ml-auto">
                                {[5, 10, 50].map(amt => (
                                  <button
                                    key={amt}
                                    onClick={() => handleCartChange(item.id, inCart + amt, avail)}
                                    className="px-2 py-1 bg-purple-950 hover:bg-purple-900 text-purple-300 border border-purple-800 rounded-lg text-[10px] font-bold"
                                  >
                                    +{amt}
                                  </button>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Dispatch Confirmation Bar */}
                  <div className="mt-6 pt-4 border-t border-purple-900/60 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-purple-300">Total Items Staged for Dispatch</p>
                      <p className="text-xl font-black text-amber-400">
                        {Object.values(dispatchCart).reduce((a, b) => a + b, 0)} Items
                      </p>
                    </div>
                    <button
                      onClick={handleConfirmDispatch}
                      disabled={Object.values(dispatchCart).reduce((a, b) => a + b, 0) === 0}
                      className="px-6 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-extrabold rounded-2xl shadow-xl disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                    >
                      🚀 Confirm Dispatch OUT
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: CATALOG */}
            {activeTab === 'catalog' && (
              <div className="space-y-4">
                {/* Search & Category Filter */}
                <div className="flex flex-col md:flex-row gap-3">
                  <input
                    type="text"
                    placeholder="🔍 Search staging, drapes, props..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="flex-1 bg-[#20072C] border border-purple-800/60 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-amber-400"
                  />
                  <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-amber-500 text-black shadow-md' : 'bg-[#20072C] text-purple-200 border border-purple-800/50'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Catalog Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredInventory.map(item => {
                    const avail = item.total - item.out - item.maintenance;
                    return (
                      <div key={item.id} className="bg-[#20072C] rounded-2xl border border-purple-800/40 overflow-hidden shadow-xl flex flex-col">
                        <div className="h-40 relative">
                          <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                          <span className="absolute top-3 left-3 bg-black/70 backdrop-blur-md text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase">
                            {item.category}
                          </span>
                        </div>
                        <div className="p-4 flex-1 flex flex-col justify-between">
                          <div>
                            <h3 className="font-bold text-base text-white">{item.name}</h3>
                            <p className="text-xs text-purple-300 mt-0.5">Unit: {item.unit}</p>
                          </div>

                          <div className="mt-4 pt-3 border-t border-purple-900/50 grid grid-cols-3 text-center gap-1">
                            <div className="bg-[#14031D] p-2 rounded-xl">
                              <p className="text-[10px] text-purple-400">Total</p>
                              <p className="font-extrabold text-sm text-white">{item.total}</p>
                            </div>
                            <div className="bg-[#14031D] p-2 rounded-xl">
                              <p className="text-[10px] text-emerald-400">Workshop</p>
                              <p className="font-extrabold text-sm text-emerald-400">{avail}</p>
                            </div>
                            <div className="bg-[#14031D] p-2 rounded-xl">
                              <p className="text-[10px] text-amber-400">At Events</p>
                              <p className="font-extrabold text-sm text-amber-400">{item.out}</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB: ACTIVE EVENTS */}
            {activeTab === 'events' && (
              <div className="space-y-4">
                {events.map(evt => (
                  <div key={evt.id} className="bg-[#20072C] p-5 rounded-2xl border border-purple-800/40 shadow-xl">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="bg-amber-500/20 text-amber-400 text-[10px] font-extrabold px-2.5 py-0.5 rounded-md uppercase border border-amber-500/30">
                          {evt.status}
                        </span>
                        <h3 className="text-lg font-extrabold text-white mt-1">{evt.name}</h3>
                        <p className="text-xs text-purple-300 mt-0.5">📍 {evt.venue} • 📅 {evt.date}</p>
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-purple-900/60">
                      <h4 className="text-xs font-bold text-purple-300 mb-2">Deployed Inventory at Location:</h4>
                      <div className="flex flex-wrap gap-2">
                        {Object.entries(evt.dispatches).map(([itemId, qty]) => {
                          const item = inventory.find(i => i.id === itemId);
                          if (!item || qty === 0) return null;
                          return (
                            <span key={itemId} className="bg-[#14031D] border border-purple-800 px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-300 flex items-center gap-2">
                              <span>{item.name}:</span>
                              <strong className="text-white bg-purple-900 px-2 py-0.5 rounded-md">{qty} {item.unit}</strong>
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
